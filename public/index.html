<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A23">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conteos">
<title>Pedidos Mozzarella Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --masa:#F2F4F0; --papel:#FFFFFF; --tinta:#1B2A23; --tinta-2:#4C5E55; --tinta-3:#7B8B83;
  --linea:#D9DFD8; --linea-2:#E8ECE6;
  --albahaca:#2D6A4D; --albahaca-2:#235640; --albahaca-claro:#E3EFE7;
  --tomate:#B93D2A; --tomate-claro:#F8E6E1;
  --ambar:#B07614; --ambar-claro:#F7EDD8;
  --azul:#2C5C86; --azul-claro:#E2ECF5;
  --r-s:6px; --r-m:10px;
  --sombra:0 1px 2px rgba(27,42,35,.06),0 8px 24px rgba(27,42,35,.08);
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --texto:'Instrument Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--masa);color:var(--tinta);font:15px/1.5 var(--texto);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--albahaca);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.15}
h2{font-size:19px}
h3{font-size:16px}
a{color:var(--albahaca)}
.oculto{display:none!important}
.muted{color:var(--tinta-3)}
.num{text-align:right;white-space:nowrap}

/* ── Estructura ───────────────────────── */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.lateral{background:var(--tinta);color:#DCE6DF;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.marca{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.marca svg{flex:none}
.marca b{font-family:var(--display);font-size:17px;line-height:1.1;color:#fff;display:block}
.marca span{font-size:12px;color:#9DB1A5}
.nav-grupo{font-size:12px;color:#8DA295;padding:14px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);color:#DCE6DF;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.activo{background:var(--albahaca);color:#fff}
.nav a .cuenta{margin-left:auto;font-size:12px;background:rgba(255,255,255,.14);padding:0 7px;border-radius:20px}
.lateral .pie{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.lateral .pie b{display:block;color:#fff}
.lateral .pie button{background:none;border:0;color:#9DB1A5;padding:4px 0;cursor:pointer;text-decoration:underline;margin-right:10px}
.principal{padding:26px 32px 60px;min-width:0}
.cabeza{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.cabeza .sub{color:var(--tinta-2);font-size:14px;margin-top:4px;max-width:70ch}
.cabeza .acciones{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn.menu-movil{display:none}
table.ancho{min-width:1300px}

/* ── Controles ───────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linea);background:var(--papel);padding:7px 13px;border-radius:var(--r-s);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--tinta-3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primario{background:var(--albahaca);border-color:var(--albahaca);color:#fff}
.btn.primario:hover{background:var(--albahaca-2)}
.btn.peligro{color:var(--tomate);border-color:#E7C2B9}
.btn.mini{padding:3px 9px;font-size:13px}
.btn.texto{border-color:transparent;background:none;color:var(--albahaca);padding:4px 6px}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=search],select,textarea{border:1px solid var(--linea);background:var(--papel);border-radius:var(--r-s);padding:7px 10px;min-width:0}
textarea{resize:vertical;width:100%}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--tinta-2);font-weight:500}
label.campo > input,label.campo > select,label.campo > textarea{font-size:15px;color:var(--tinta);font-weight:400}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filtros input[type=search]{width:260px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--papel);border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:#fff}

/* ── Tablas ───────────────────────── */
.caja{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r-m);overflow:hidden}
.tabla-scroll{overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;border-bottom:1px solid var(--linea-2);text-align:left;vertical-align:middle}
th{font-size:12.5px;font-weight:600;color:var(--tinta-2);background:#F8F9F7;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr.clic{cursor:pointer}
tbody tr.clic:hover td{background:#F6F8F5}
.vacio{padding:40px 20px;text-align:center;color:var(--tinta-2)}
.vacio b{display:block;font-family:var(--display);font-size:18px;color:var(--tinta);margin-bottom:4px}

/* ── Matriz consolidada ───────────── */
.matriz{max-height:calc(100vh - 250px);font-size:13.5px}
.matriz table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
.matriz th,.matriz td{padding:0;border-bottom:1px solid var(--linea-2);background:var(--papel)}
.matriz thead th{position:sticky;z-index:2;background:#F6F7F4;font-weight:600;color:var(--tinta-2);font-size:12px}
.matriz thead tr.bandas th{top:0;height:26px;padding:0 8px;text-align:left;border-bottom:0;color:var(--tinta);font-size:11.5px;letter-spacing:.02em}
.matriz thead tr.bandas th.banda{border-left:2px solid var(--papel);background:#EDF1EC}
.matriz thead tr.cols th{top:var(--top-cols,0px);height:46px;vertical-align:bottom;padding:6px 8px;border-bottom:1px solid var(--linea)}
.matriz .fijo{position:sticky;z-index:1}
.matriz thead .fijo{z-index:4}
.matriz .c-prod{left:0;width:270px;min-width:270px;max-width:270px}
.matriz .c-tot{left:270px;width:88px;min-width:88px;text-align:right}
.matriz .c-val{left:358px;width:104px;min-width:104px;text-align:right;box-shadow:inset -1px 0 0 var(--linea)}
.matriz td.c-tot{background:#F5F8F5;font-weight:600}
.matriz td.c-val{background:#F5F8F5;color:var(--tinta-2)}
.matriz td.c-prod,.matriz td.c-tot,.matriz td.c-val{padding:0 10px;height:34px}
.matriz th.suc{width:86px;min-width:86px;max-width:86px;font-size:11.5px;text-align:right;line-height:1.2;white-space:normal}
.matriz th.suc span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.matriz th.ini-grupo,.matriz td.ini-grupo{border-left:2px solid var(--linea)}
.matriz th.ordenable{cursor:pointer;user-select:none}
.matriz th.ordenable:hover{color:var(--tinta)}
.matriz th .flecha{font-size:10px;margin-left:3px}
.prod-l{display:flex;align-items:baseline;gap:8px;min-width:0}
.prod-l .nom{font-weight:500;color:var(--tinta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prod-l .cod{font-size:11.5px;color:var(--tinta-3);white-space:nowrap;flex:none}
.matriz tr.dep td{background:#F1F4F0;height:30px;padding:0 10px;font-size:12.5px;color:var(--tinta-2);border-bottom:1px solid var(--linea)}
.matriz tr.dep .dep-b{position:sticky;left:0;display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;cursor:pointer;color:var(--tinta);font-weight:600;font-size:12.5px}
.matriz tr.dep .dep-b i{display:inline-block;transition:transform .15s;font-style:normal;color:var(--tinta-3)}
.matriz tr.dep.cerrado .dep-b i{transform:rotate(-90deg)}
@media (prefers-reduced-motion:reduce){.matriz tr.dep .dep-b i{transition:none}}
.matriz tbody tr:not(.dep):hover td{background:#F7FAF7}
.matriz tbody tr:not(.dep):hover td.c-tot,.matriz tbody tr:not(.dep):hover td.c-val{background:#EEF4EF}
.celda{display:block;width:100%;height:34px;border:0;background:transparent;padding:0 8px;text-align:right;cursor:pointer;position:relative;font:inherit;color:var(--tinta)}
.celda:hover,.celda:focus-visible{outline:2px solid var(--albahaca);outline-offset:-2px}
.celda.nomaneja{cursor:default;background:repeating-linear-gradient(135deg,transparent 0 5px,#F1F2EF 5px 6px)}
.celda.nomaneja:hover{outline:0}
.celda.bajo{color:#7A5208;background:#FBF1DC;font-weight:600}
.celda.agotado{color:#9A2E1E;background:#FBEDEA;font-weight:600}
.celda.neg{color:#fff;background:var(--tomate);font-weight:600}
.celda .marca-aj{position:absolute;top:4px;left:5px;width:6px;height:6px;border-radius:50%;background:var(--ambar)}
.celda .transito{position:absolute;bottom:2px;right:8px;font-size:10px;color:var(--azul);line-height:1;font-weight:600}
.matriz td.neg-t{color:var(--tomate)}
.barra-inv{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.barra-inv .sep{flex:1}
.interruptor{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--tinta-2);cursor:pointer;user-select:none}
.interruptor input{width:16px;height:16px;accent-color:var(--albahaca)}
.leyenda{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--tinta-2);margin-top:10px;align-items:center}
.leyenda i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--linea)}

/* ── Estados ───────────────────────── */
.est{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap}
.est.borrador{background:#ECEFEA;color:var(--tinta-2)}
.est.enviada{background:var(--azul-claro);color:var(--azul)}
.est.recibida_parcial,.est.pendiente{background:var(--ambar-claro);color:var(--ambar)}
.est.recibida,.est.capturado,.est.ok{background:var(--albahaca-claro);color:var(--albahaca-2)}
.est.cancelada,.est.cancelado,.est.error{background:var(--tomate-claro);color:var(--tomate)}
.barra{height:6px;background:var(--linea-2);border-radius:4px;overflow:hidden;min-width:70px}
.barra i{display:block;height:100%;background:var(--albahaca)}
.dif-neg{color:var(--tomate);font-weight:600}
.dif-pos{color:var(--albahaca);font-weight:600}

.resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:var(--r-m);overflow:hidden;margin-bottom:16px}
.resumen div{background:var(--papel);padding:12px 16px}
.resumen b{display:block;font-family:var(--display);font-size:22px;font-weight:700}
.resumen span{font-size:13px;color:var(--tinta-2)}

/* ── Panel lateral y modales ───────────────────────── */
.velo{position:fixed;inset:0;background:rgba(27,42,35,.35);z-index:40;display:flex;justify-content:flex-end}
.panel{background:var(--masa);width:min(920px,100%);height:100%;overflow:auto;box-shadow:var(--sombra);display:flex;flex-direction:column;animation:entra .18s ease-out}
.panel.angosto{width:min(560px,100%)}
@keyframes entra{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.panel-cab{padding:20px 24px 14px;background:var(--papel);border-bottom:1px solid var(--linea);display:flex;gap:12px;align-items:flex-start;position:sticky;top:0;z-index:2}
.panel-cab .cerrar{margin-left:auto}
.panel-cuerpo{padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.panel-pie{margin-top:auto;padding:14px 24px;background:var(--papel);border-top:1px solid var(--linea);display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pasos{display:flex;gap:0;list-style:none;padding:0;margin:0;font-size:13px}
.pasos li{flex:1;padding:8px 0 0;border-top:3px solid var(--linea);color:var(--tinta-3);margin-right:4px}
.pasos li.hecho{border-color:var(--albahaca);color:var(--tinta)}
.pasos li.actual{border-color:var(--albahaca);color:var(--tinta);font-weight:600}
.pasos li.cancelada{border-color:var(--tomate);color:var(--tomate);font-weight:600}
.historial{list-style:none;padding:0;margin:0;border-left:2px solid var(--linea);padding-left:14px}
.historial li{margin-bottom:10px;font-size:14px;position:relative}
.historial li::before{content:"";position:absolute;left:-20px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--albahaca)}
.historial small{color:var(--tinta-3);display:block}
.buscador{position:relative}
.buscador .resultados{position:absolute;top:100%;left:0;right:0;background:var(--papel);border:1px solid var(--linea);border-radius:var(--r-s);box-shadow:var(--sombra);z-index:5;max-height:300px;overflow:auto;margin-top:4px}
.buscador .resultados button{display:flex;width:100%;gap:10px;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer;border-bottom:1px solid var(--linea-2)}
.buscador .resultados button:hover,.buscador .resultados button:focus{background:var(--albahaca-claro)}
.buscador .resultados .ex{margin-left:auto;color:var(--tinta-2);font-size:13px;white-space:nowrap}
td input[type=number]{width:100px;text-align:right}
.aviso{padding:10px 14px;border-radius:var(--r-s);font-size:14px;background:var(--azul-claro);color:#1E4466}
.aviso.alerta{background:var(--ambar-claro);color:#6D4A0C}
.aviso.error{background:var(--tomate-claro);color:#7E2516}

.popover{position:fixed;z-index:30;background:var(--papel);border:1px solid var(--linea);border-radius:var(--r-m);box-shadow:var(--sombra);padding:12px 14px;width:270px;font-size:14px}
.popover .acc{display:flex;gap:6px;margin-top:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 18px;border-radius:var(--r-s);z-index:60;box-shadow:var(--sombra);max-width:90vw}
.toast.error{background:var(--tomate)}
.carga{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:gira .7s linear infinite;vertical-align:-2px}
@keyframes gira{to{transform:rotate(360deg)}}

/* ── Login ───────────────────────── */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .lado{background:var(--tinta);color:#E2EBE5;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login .lado h1{font-size:44px;color:#fff;max-width:11ch;line-height:1.02}
.login .lado p{max-width:42ch;color:#AFC2B6}
.login form{align-self:center;justify-self:center;width:min(360px,90%);display:flex;flex-direction:column;gap:14px}

/* ── Impresión de orden ───────────────────────── */
#impresion{display:none}
@media print{
  body *{visibility:hidden}
  #impresion,#impresion *{visibility:visible}
  #impresion{display:block;position:absolute;inset:0;padding:24px;font-size:12px}
  #impresion table{border:1px solid #999}
  #impresion th,#impresion td{border:1px solid #ccc;padding:5px 8px}
}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .lateral{position:fixed;inset:0 30% 0 0;z-index:50;height:100%;transform:translateX(-100%);transition:transform .2s}
  .lateral.abierto{transform:none}
  .btn.menu-movil{display:inline-flex}
  .principal{padding:16px 16px 60px}
  .login{grid-template-columns:1fr}
  .login .lado{padding:28px}
  .login .lado h1{font-size:32px}
  .filtros input[type=search]{width:100%}
  .matriz .col-total{position:static}
  .matriz .col-prod{min-width:170px}
}

/* ── App de conteo (teléfono) ───────────────────────── */
.movil{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--masa)}
.movil-cab{background:var(--tinta);color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.movil-cab b{font-family:var(--display);font-size:16px;display:block;line-height:1.15}
.movil-cab span{font-size:12.5px;color:#AFC2B6}
.movil-cab .btn{margin-left:auto;background:transparent;color:#DCE6DF;border-color:rgba(255,255,255,.25)}
.movil-cuerpo{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:720px;width:100%;margin:0 auto}
.movil-cuerpo h2{font-size:18px}
.tarea{display:flex;align-items:center;gap:12px;background:var(--papel);border:1px solid var(--linea);border-radius:var(--r-m);padding:14px 16px;width:100%;text-align:left;cursor:pointer;font:inherit}
.tarea:hover{border-color:var(--albahaca)}
.tarea b{display:block;font-size:16px}
.tarea .muted{font-size:13.5px}
.tarea .est{margin-left:auto;flex:none}
.tarea.hecha{opacity:.65}
.lista-tareas{display:flex;flex-direction:column;gap:8px}
.banner-instalar{display:flex;gap:12px;align-items:center;background:var(--albahaca-claro);border:1px solid #C5DDCD;border-radius:var(--r-m);padding:12px 14px;font-size:14px}
.banner-instalar .btn{margin-left:auto;flex:none}

/* Sesión de conteo */
.contando{position:fixed;inset:0;z-index:45;background:var(--masa);display:flex;flex-direction:column}
.contando-cab{background:var(--papel);border-bottom:1px solid var(--linea);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.contando-cab .fila{display:flex;align-items:center;gap:10px}
.contando-cab h2{font-size:17px;line-height:1.2}
.contando-cab .avance{height:5px;background:var(--linea-2);border-radius:3px;margin-top:10px;overflow:hidden}
.contando-cab .avance i{display:block;height:100%;background:var(--albahaca);transition:width .2s}
@media (prefers-reduced-motion:reduce){.contando-cab .avance i{transition:none}}
.contando-filtros{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;background:var(--papel);border-bottom:1px solid var(--linea);scrollbar-width:none}
.contando-filtros .chip{flex:none}
.contando-buscar{padding:10px 16px 0}
.contando-buscar input{width:100%;font-size:16px;padding:10px 12px}
.contando-lista{flex:1;overflow:auto;padding:8px 16px 120px;-webkit-overflow-scrolling:touch}
.dep-titulo{font-size:13px;font-weight:600;color:var(--tinta-2);padding:14px 2px 6px;position:sticky;top:-8px;background:var(--masa);z-index:1}
.prod{display:flex;align-items:center;gap:12px;background:var(--papel);border:1px solid var(--linea);border-radius:var(--r-m);padding:10px 12px;margin-bottom:8px}
.prod.contado{border-color:#9CC6AE;background:#F4FAF6}
.prod.recontar{border-color:var(--ambar);background:var(--ambar-claro)}
.prod .info{flex:1;min-width:0}
.prod .info b{display:block;font-size:15.5px;line-height:1.25}
.prod .info span{font-size:13px;color:var(--tinta-3)}
.prod input{width:96px;font-size:20px;font-weight:600;text-align:right;padding:8px 10px;border-radius:var(--r-s);border:1.5px solid var(--linea)}
.prod input:focus{border-color:var(--albahaca);outline:none;box-shadow:0 0 0 3px rgba(45,106,77,.18)}
.contando-pie{position:fixed;left:0;right:0;bottom:0;background:var(--papel);border-top:1px solid var(--linea);padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:2}

<body>
<div id="raiz"></div>
<div id="impresion"></div>

<script>
'use strict';
// ════════════════════════════════════════════════════════════════
//  Utilidades
// ════════════════════════════════════════════════════════════════
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n0 = new Intl.NumberFormat('es-MX', { maximumFractionDigits: 2 });
const mx = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
const fmt = v => (v == null || v === '' ? '—' : n0.format(Number(v)));
const dinero = v => (v == null ? '—' : mx.format(Number(v)));
const fecha = v => v ? new Date(v).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const fechaHora = v => v ? new Date(v).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
const hace = v => {
  if (!v) return 'nunca';
  const m = Math.round((Date.now() - new Date(v)) / 60000);
  if (m < 1) return 'hace un momento';
  if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `hace ${h} h`;
  return fecha(v);
};
const ESTADO_OC = { borrador: 'Borrador', enviada: 'Enviada', recibida_parcial: 'Recibida parcial', recibida: 'Recibida', cancelada: 'Cancelada' };
const ESTADO_AJ = { pendiente: 'Pendiente en Wansoft', capturado: 'Capturado en Wansoft', cancelado: 'Cancelado' };
const ROLES = { admin: 'Administrador', compras: 'Compras', supervisor: 'Supervisor', sucursal: 'Gerente de sucursal', empleado: 'Empleado (solo conteos)' };
const ROLES_ACOTADOS = ['sucursal', 'supervisor', 'empleado'];
const acotado = () => ROLES_ACOTADOS.includes(S.user?.rol);
const esRevisor = () => ['admin', 'supervisor'].includes(S.user?.rol);

const S = {
  token: null, user: null, sucursales: [], proveedores: [], motivos: [],
  vista: 'inventario', consolidado: null,
  filtroInv: { q: '', departamento: '', grupo: 'todas', modo: 'sucursales', ocultarCeros: true, soloAgotados: false, orden: 'departamento', dir: 1, cerrados: [] },
};
try { S.token = localStorage.getItem('mz_token'); } catch {}

async function api(ruta, opts = {}) {
  const res = await fetch('/api' + ruta, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch {}
  if (res.status === 401 && S.token && !ruta.startsWith('/auth/login')) { salir(); throw new Error(data?.error || 'Sesión expirada'); }
  if (!res.ok) throw new Error(data?.error || `Error ${res.status}`);
  return data;
}

function toast(msg, tipo) {
  const t = document.createElement('div');
  t.className = 'toast' + (tipo === 'error' ? ' error' : '');
  t.setAttribute('role', 'status');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), tipo === 'error' ? 5000 : 2600);
}

// Ejecuta una acción con botón ocupado y avisa errores
async function accion(btn, fn) {
  const txt = btn?.innerHTML;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="carga"></span> ' + txt; }
  try { return await fn(); }
  catch (e) { toast(e.message, 'error'); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = txt; } }
}

const esAdmin = () => S.user?.rol === 'admin';
const esCompras = () => ['admin', 'compras'].includes(S.user?.rol);
const puedeCapturarAj = () => ['admin', 'compras', 'supervisor'].includes(S.user?.rol);

function opcionesSucursal(sel, vacia = 'Elige una sucursal') {
  return `<option value="">${esc(vacia)}</option>` + S.sucursales.filter(s => s.activa).map(s =>
    `<option value="${s.id}" ${String(sel) === String(s.id) ? 'selected' : ''}>${esc(s.nombre)}</option>`).join('');
}
function opcionesProveedor(sel) {
  return `<option value="">Sin proveedor</option>` + S.proveedores.filter(p => p.activo || p.id == sel).map(p =>
    `<option value="${p.id}" ${String(sel) === String(p.id) ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('');
}

// Grupos de sucursales según su nombre
// Grupos de sucursales: los define el administrador en Sucursales
const SIN_GRUPO = 'Sin grupo';
const grupoSuc = s => (S.sucursales.find(x => x.id === s.id)?.grupo) || SIN_GRUPO;
function gruposInv() {
  const usados = new Set(S.sucursales.filter(s => s.activa).map(s => s.grupo || SIN_GRUPO));
  return [...(S.grupos || []).filter(g => usados.has(g)), ...(usados.has(SIN_GRUPO) ? [SIN_GRUPO] : [])];
}
// Nombre corto para el encabezado: sin el prefijo de la marca
function nombreCorto(n) {
  if (/burger/i.test(n)) return n.replace(/^.*burger\s*-\s*/i, 'Burger ');
  return n.replace(/^(PTG|Mozarellas? Pizza)\s*-\s*/i, '').replace(/^CEDIS\s*-\s*/i, 'CEDIS ');
}

// ════════════════════════════════════════════════════════════════
//  Panel lateral (detalle / formularios)
// ════════════════════════════════════════════════════════════════
let panelPrevFocus = null;
function abrirPanel(html, { angosto = false } = {}) {
  cerrarPanel();
  panelPrevFocus = document.activeElement;
  const v = document.createElement('div');
  v.className = 'velo';
  v.id = 'velo';
  v.innerHTML = `<div class="panel ${angosto ? 'angosto' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  v.addEventListener('mousedown', e => { if (e.target === v) cerrarPanel(); });
  document.body.appendChild(v);
  const f = v.querySelector('input,select,textarea,button:not(.cerrar)');
  f && f.focus();
  return v.firstElementChild;
}
function cerrarPanel() {
  const v = $('#velo');
  if (v) { v.remove(); panelPrevFocus?.focus?.(); }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { cerrarPopover(); cerrarPanel(); } });
const botonCerrar = `<button class="btn texto cerrar" onclick="cerrarPanel()" aria-label="Cerrar">Cerrar</button>`;

// ════════════════════════════════════════════════════════════════
//  Buscador de productos (reutilizable)
// ════════════════════════════════════════════════════════════════
function montarBuscador(cont, { sucursal, alElegir }) {
  cont.innerHTML = `<div class="buscador"><input type="search" placeholder="Busca por nombre o código" style="width:100%" aria-label="Buscar producto"><div class="resultados oculto"></div></div>`;
  const inp = $('input', cont), res = $('.resultados', cont);
  let t, ult = [];
  const pintar = items => {
    ult = items;
    if (!items.length) { res.innerHTML = `<div class="vacio" style="padding:14px">No hay productos con ese nombre. Sincroniza el inventario si es nuevo.</div>`; res.classList.remove('oculto'); return; }
    res.innerHTML = items.map((p, i) => `<button type="button" data-i="${i}"><span><b>${esc(p.nombre || p.codigo)}</b><br><span class="muted">${esc(p.codigo)} · ${esc(p.unidad || '')}</span></span>
      <span class="ex">${sucursal() ? 'En sucursal: ' + fmt(p.existencia_sucursal ?? 0) : 'Total: ' + fmt(p.total)}</span></button>`).join('');
    res.classList.remove('oculto');
  };
  inp.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(async () => {
      const q = inp.value.trim();
      if (q.length < 2) { res.classList.add('oculto'); return; }
      try { pintar(await api(`/inventario/productos?q=${encodeURIComponent(q)}${sucursal() ? '&sucursal_id=' + sucursal() : ''}`)); }
      catch (e) { toast(e.message, 'error'); }
    }, 220);
  });
  res.addEventListener('click', e => {
    const b = e.target.closest('button[data-i]');
    if (!b) return;
    alElegir(ult[b.dataset.i]);
    inp.value = ''; res.classList.add('oculto'); inp.focus();
  });
  inp.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { const b = $('button', res); b && b.focus(); e.preventDefault(); } });
  document.addEventListener('mousedown', e => { if (!cont.contains(e.target)) res.classList.add('oculto'); });
}

// ════════════════════════════════════════════════════════════════
//  Arranque y navegación
// ════════════════════════════════════════════════════════════════
async function iniciar() {
  if (!S.token) return pintarLogin();
  try {
    S.user = await api('/auth/me');
    await cargarCatalogos();
    pintarApp();
  } catch { pintarLogin(); }
}
async function cargarCatalogos() {
  if (S.user?.rol === 'empleado') { S.sucursales = []; S.proveedores = []; S.motivos = []; return; }
  const [s, p, m] = await Promise.all([api('/sucursales'), api('/proveedores'), api('/ajustes/motivos')]);
  S.sucursales = s.sucursales; S.grupos = s.grupos || []; S.proveedores = p; S.motivos = m;
}
function salir() {
  S.token = null; S.user = null;
  try { localStorage.removeItem('mz_token'); } catch {}
  cerrarPanel();
  pintarLogin();
}

function pintarLogin() {
  $('#raiz').innerHTML = `
  <div class="login">
    <div class="lado">
      <div class="marca" style="padding:0">${logo(34)}<div><b>Mozzarella Express</b><span>Pedidos e inventario</span></div></div>
      <div>
        <h1>Todas las sucursales en una sola vista.</h1>
        <p>Consulta el inventario de Wansoft consolidado, registra ajustes y da seguimiento a cada orden de compra hasta que llegue.</p>
      </div>
      <span class="muted" style="font-size:13px">Datos tomados de Wansoft</span>
    </div>
    <form id="f-login">
      <h2>Iniciar sesión</h2>
      <label class="campo">Usuario<input type="text" name="usuario" autocomplete="username" required></label>
      <label class="campo">Contraseña<input type="password" name="password" autocomplete="current-password" required></label>
      <div id="login-err" class="aviso error oculto" role="alert"></div>
      <button class="btn primario" style="justify-content:center;padding:10px">Entrar</button>
    </form>
  </div>`;
  $('#f-login').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = $('button', e.target);
    btn.disabled = true;
    try {
      const r = await api('/auth/login', { method: 'POST', body: { usuario: fd.get('usuario'), password: fd.get('password') } });
      S.token = r.token; S.user = r.user;
      try { localStorage.setItem('mz_token', r.token); } catch {}
      await cargarCatalogos();
      pintarApp();
    } catch (err) {
      const el = $('#login-err'); el.textContent = err.message; el.classList.remove('oculto');
    } finally { btn.disabled = false; }
  });
  $('[name=usuario]').focus();
}

function logo(size = 30) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="18" fill="#E9B44C"/><circle cx="20" cy="20" r="14.5" fill="#F6E7C1"/>
    <circle cx="14" cy="15" r="3" fill="#B93D2A"/><circle cx="25" cy="13" r="2.6" fill="#B93D2A"/><circle cx="23" cy="25" r="3.2" fill="#B93D2A"/><circle cx="13.5" cy="25" r="2.2" fill="#B93D2A"/>
    <path d="M17 20.5c1.5-1 2.8-.9 4 .2" stroke="#2D6A4D" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
}

const VISTAS = [
  { id: 'inventario', t: 'Inventario', grupo: 'Operación' },
  { id: 'ordenes', t: 'Órdenes de compra', grupo: 'Operación' },
  { id: 'conteos', t: 'Conteos', grupo: 'Operación', roles: ['admin', 'supervisor', 'compras'] },
  { id: 'ajustes', t: 'Ajustes', grupo: 'Operación' },
  { id: 'contar', t: 'Capturar conteo', grupo: 'Operación', roles: ['admin', 'supervisor', 'sucursal'] },
  { id: 'proveedores', t: 'Proveedores', grupo: 'Operación' },
  { id: 'sucursales', t: 'Sucursales y Wansoft', grupo: 'Administración', admin: true },
  { id: 'usuarios', t: 'Usuarios', grupo: 'Administración', admin: true },
  { id: 'diagnostico', t: 'Diagnóstico Wansoft', grupo: 'Administración', admin: true },
  { id: 'bitacora', t: 'Bitácora', grupo: 'Administración', admin: true },
];

const vistaPermitida = v => (!v.admin || esAdmin()) && (!v.roles || v.roles.includes(S.user.rol));

function pintarApp() {
  if (S.user.rol === 'empleado') return pintarAppEmpleado();
  let grupo = '';
  const nav = VISTAS.filter(vistaPermitida).map(v => {
    const g = v.grupo !== grupo ? `<div class="nav-grupo">${esc(v.grupo)}</div>` : '';
    grupo = v.grupo;
    return g + `<a href="#${v.id}" data-v="${v.id}">${esc(v.t)}${v.id === 'conteos' ? '<span class="cuenta oculto" id="cuenta-conteos"></span>' : ''}</a>`;
  }).join('');
  $('#raiz').innerHTML = `
  <div class="app">
    <aside class="lateral" id="lateral">
      <div class="marca">${logo()}<div><b>Mozzarella Express</b><span>Pedidos e inventario</span></div></div>
      <nav class="nav" aria-label="Secciones">${nav}</nav>
      <div class="pie"><b>${esc(S.user.nombre)}</b><span>${esc(ROLES[S.user.rol])}</span><br>
        <button onclick="cambiarPassword()">Cambiar contraseña</button><button onclick="salir()">Salir</button></div>
    </aside>
    <main class="principal" id="vista"></main>
  </div>`;
  const destino = location.hash.slice(1);
  ir(VISTAS.some(v => v.id === destino && vistaPermitida(v)) ? destino : (S.user.rol === 'supervisor' ? 'conteos' : 'inventario'));
  actualizarCuentaConteos();
}
async function actualizarCuentaConteos() {
  const el = $('#cuenta-conteos');
  if (!el) return;
  try {
    const n = (await api('/conteos?estado=enviado')).length;
    el.textContent = n; el.classList.toggle('oculto', !n);
  } catch {}
}
window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (S.user && S.user.rol !== 'empleado' && v && v !== S.vista && VISTAS.some(x => x.id === v && vistaPermitida(x))) ir(v);
});

function ir(v) {
  S.vista = v;
  if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v);
  $$('.nav a').forEach(a => a.classList.toggle('activo', a.dataset.v === v));
  $('#lateral')?.classList.remove('abierto');
  cerrarPopover();
  const fn = { conteos: vConteos, contar: () => vContar($('#vista')), inventario: vInventario, ordenes: vOrdenes, ajustes: vAjustes, proveedores: vProveedores, sucursales: vSucursales, usuarios: vUsuarios, diagnostico: vDiagnostico, bitacora: vBitacora }[v];
  fn();
}
document.addEventListener('click', e => {
  const a = e.target.closest('.nav a[data-v]');
  if (a) { e.preventDefault(); ir(a.dataset.v); }
});

function cabeza(titulo, sub, acciones = '') {
  return `<div class="cabeza">
    <button class="btn menu-movil" onclick="$('#lateral').classList.toggle('abierto')" aria-label="Menú">Menú</button>
    <div><h1>${esc(titulo)}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div>
    <div class="acciones">${acciones}</div></div>`;
}

// ════════════════════════════════════════════════════════════════
//  Vista: Inventario consolidado
// ════════════════════════════════════════════════════════════════
async function vInventario() {
  const conClaves = S.sucursales.filter(s => s.wansoft_id && s.tiene_password);
  const ultimo = S.sucursales.map(s => s.ultimo_sync).filter(Boolean).sort().pop();
  const conError = S.sucursales.filter(s => s.ultimo_error && s.activa);
  $('#vista').innerHTML = cabeza('Inventario consolidado',
    `Existencias de Wansoft por sucursal. Última actualización ${esc(hace(ultimo))}.` +
    (conError.length ? ` <a href="#sucursales">${conError.length} sucursal${conError.length > 1 ? 'es' : ''} con error</a>.` : ''),
    `${esCompras() ? `<button class="btn" id="b-sync">Actualizar desde Wansoft</button>` : ''}
     <button class="btn" id="b-csv">Descargar CSV</button>
     <button class="btn primario" id="b-pedir">Nueva orden de compra</button>`) +
  `<div class="barra-inv">
     <input type="search" id="f-q" placeholder="Buscar producto o código" value="${esc(S.filtroInv.q)}" aria-label="Buscar producto" style="width:240px">
     <select id="f-dep" aria-label="Departamento"><option value="">Todos los departamentos</option></select>
     ${!acotado() && gruposInv().length > 1 ? `<div class="chips" role="group" aria-label="Grupo de sucursales">${[['todas', 'Todas'], ...gruposInv().map(g => [g, g])].map(([k, t]) =>
        `<button class="chip" data-g="${esc(k)}" aria-pressed="${S.filtroInv.grupo === k}">${esc(t)}</button>`).join('')}</div>` : ''}
     <span class="sep"></span>
     <div class="chips" role="group" aria-label="Vista">
       <button class="chip" data-m="sucursales" aria-pressed="${S.filtroInv.modo === 'sucursales'}">Por sucursal</button>
       <button class="chip" data-m="totales" aria-pressed="${S.filtroInv.modo === 'totales'}">Solo totales</button>
     </div>
   </div>
   <div class="barra-inv">
     <label class="interruptor"><input type="checkbox" id="f-ceros" ${S.filtroInv.ocultarCeros ? 'checked' : ''}> Ocultar productos sin existencia</label>
     <label class="interruptor"><input type="checkbox" id="f-agot" ${S.filtroInv.soloAgotados ? 'checked' : ''}> Solo agotados en alguna sucursal</label>
     <label class="interruptor"><input type="checkbox" id="f-pedir" ${S.filtroInv.paraPedir ? 'checked' : ''}> Solo en punto de reorden</label>
     <span class="sep"></span>
     <label class="interruptor">Ordenar por
       <select id="f-orden" aria-label="Ordenar por">${[['departamento', 'Departamento'], ['nombre', 'Nombre'], ['total', 'Existencia total'], ['valor', 'Valor'], ['agotados', 'Más agotados']].map(([k, t]) =>
         `<option value="${k}" ${S.filtroInv.orden === k ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
   </div>
   <div id="inv-cont"><div class="vacio"><span class="carga"></span></div></div>`;

  if (!conClaves.length && esAdmin()) {
    $('#inv-cont').innerHTML = `<div class="caja vacio"><b>Todavía no hay sucursales conectadas</b>Agrega el ID y la contraseña de Wansoft de cada sucursal para traer su inventario.<br><br><button class="btn primario" onclick="ir('sucursales')">Conectar sucursales</button></div>`;
  }

  $('#b-sync')?.addEventListener('click', e => accion(e.currentTarget, async () => {
    toast('Consultando Wansoft, puede tardar un par de minutos…');
    const r = await api('/sucursales/sync', { method: 'POST' });
    const ok = r.resultados.filter(x => x.ok).length, mal = r.resultados.length - ok;
    toast(`Inventario actualizado en ${ok} sucursal${ok === 1 ? '' : 'es'}${mal ? ` · ${mal} con error` : ''}`, mal ? 'error' : null);
    await cargarCatalogos(); vInventario();
  }));
  $('#b-csv').addEventListener('click', descargarCSV);
  $('#b-pedir').addEventListener('click', () => editorOrden());
  let t;
  $('#f-q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { S.filtroInv.q = e.target.value; cargarConsolidado(); }, 250); });
  $('#f-dep').addEventListener('change', e => { S.filtroInv.departamento = e.target.value; cargarConsolidado(); });
  $$('[data-g]').forEach(b => b.addEventListener('click', () => { S.filtroInv.grupo = b.dataset.g; $$('[data-g]').forEach(x => x.setAttribute('aria-pressed', x === b)); pintarMatriz(); }));
  $$('[data-m]').forEach(b => b.addEventListener('click', () => { S.filtroInv.modo = b.dataset.m; $$('[data-m]').forEach(x => x.setAttribute('aria-pressed', x === b)); pintarMatriz(); }));
  $('#f-ceros').onchange = e => { S.filtroInv.ocultarCeros = e.target.checked; pintarMatriz(); };
  $('#f-agot').onchange = e => { S.filtroInv.soloAgotados = e.target.checked; pintarMatriz(); };
  $('#f-pedir').onchange = e => { S.filtroInv.paraPedir = e.target.checked; pintarMatriz(); };
  $('#f-orden').onchange = e => { S.filtroInv.orden = e.target.value; S.filtroInv.dir = ['total', 'valor', 'agotados'].includes(e.target.value) ? -1 : 1; pintarMatriz(); };
  if (conClaves.length || !esAdmin()) cargarConsolidado();
}

async function cargarConsolidado() {
  try {
    const p = new URLSearchParams({ q: S.filtroInv.q, departamento: S.filtroInv.departamento });
    S.consolidado = await api('/inventario/consolidado?' + p);
    const dep = $('#f-dep');
    if (dep && dep.options.length <= 1) {
      dep.innerHTML = '<option value="">Todos los departamentos</option>' + S.consolidado.departamentos.map(d => `<option ${d === S.filtroInv.departamento ? 'selected' : ''}>${esc(d)}</option>`).join('');
    }
    pintarMatriz();
  } catch (e) { $('#inv-cont').innerHTML = `<div class="aviso error">${esc(e.message)}</div>`; }
}

function sucursalesVisibles() {
  const d = S.consolidado;
  // Solo sucursales conectadas: con inventario sincronizado o con error de conexión
  const conDatos = new Set(d.productos.flatMap(p => Object.keys(p.por).map(Number)));
  const orden = gruposInv();
  if (S.filtroInv.grupo !== 'todas' && !orden.includes(S.filtroInv.grupo)) S.filtroInv.grupo = 'todas';
  return d.sucursales.filter(s => (conDatos.has(s.id) || s.ultimo_error) &&
    (S.filtroInv.grupo === 'todas' || grupoSuc(s) === S.filtroInv.grupo))
    .sort((a, b) => orden.indexOf(grupoSuc(a)) - orden.indexOf(grupoSuc(b)) || a.nombre.localeCompare(b.nombre, 'es'));
}

function productosVisibles(ids) {
  const f = S.filtroInv;
  let prods = S.consolidado.productos.map(p => {
    const total = ids.reduce((a, id) => a + (p.por[id] || 0), 0);
    const maneja = ids.filter(id => id in p.por);
    return { ...p, totalVis: total, valorVis: p.costo != null ? total * p.costo : null, maneja,
      agotadas: maneja.filter(id => p.por[id] <= 0).length, negativas: maneja.filter(id => p.por[id] < 0).length,
      paraPedir: maneja.filter(id => p.reorden?.[id]?.pedir).length };
  }).filter(p => p.maneja.length);
  if (f.ocultarCeros) prods = prods.filter(p => p.maneja.some(id => p.por[id] !== 0));
  if (f.soloAgotados) prods = prods.filter(p => p.agotadas > 0);
  if (f.paraPedir) prods = prods.filter(p => p.paraPedir > 0);
  const nom = p => String(p.nombre || p.codigo);
  const cmp = {
    departamento: (a, b) => String(a.departamento || '~').localeCompare(String(b.departamento || '~')) || nom(a).localeCompare(nom(b), 'es'),
    nombre: (a, b) => f.dir * nom(a).localeCompare(nom(b), 'es'),
    total: (a, b) => f.dir * (a.totalVis - b.totalVis),
    valor: (a, b) => f.dir * ((a.valorVis || 0) - (b.valorVis || 0)),
    agotados: (a, b) => f.dir * (a.agotadas - b.agotadas) || nom(a).localeCompare(nom(b), 'es'),
  }[f.orden] || ((a, b) => 0);
  return prods.sort(cmp);
}

function pintarMatriz() {
  const d = S.consolidado;
  if (!d || !$('#inv-cont')) return;
  const f = S.filtroInv;
  const sucs = sucursalesVisibles();
  const ids = sucs.map(s => s.id);
  const prods = productosVisibles(ids);

  if (!prods.length) {
    $('#inv-cont').innerHTML = `<div class="caja vacio"><b>Sin productos</b>${f.q || f.departamento || f.soloAgotados || f.paraPedir ? 'Ningún producto coincide con los filtros.' : 'Todavía no hay existencias para estas sucursales.'}</div>`;
    return;
  }
  const valor = prods.reduce((a, p) => a + (p.valorVis || 0), 0);
  const agotados = prods.filter(p => p.agotadas > 0).length;
  const enReorden = prods.reduce((a, p) => a + p.paraPedir, 0);
  const negativos = prods.reduce((a, p) => a + p.negativas, 0);
  const ajustes = prods.reduce((a, p) => a + Object.keys(p.ajuste).filter(id => ids.includes(+id)).length, 0);
  const transito = prods.reduce((a, p) => a + Object.keys(p.transito).filter(id => ids.includes(+id)).length, 0);

  const resumen = `<div class="resumen">
    <div><b>${fmt(prods.length)}</b><span>Productos en la vista · ${sucs.length} sucursal${sucs.length === 1 ? '' : 'es'}</span></div>
    <div><b>${dinero(valor)}</b><span>Valor del inventario a costo</span></div>
    <div><b style="color:${agotados ? '#9A2E1E' : 'inherit'}">${fmt(agotados)}</b><span>Productos agotados en al menos una sucursal</span></div>
    ${enReorden ? `<div><b style="color:#7A5208">${fmt(enReorden)}</b><span>En punto de reorden (producto × sucursal)</span></div>` : ''}
    ${negativos ? `<div><b style="color:var(--tomate)">${fmt(negativos)}</b><span>Existencias negativas por revisar</span></div>` : ''}
    ${ajustes ? `<div><b>${fmt(ajustes)}</b><span>Ajustes por capturar en Wansoft</span></div>` : ''}
    ${transito ? `<div><b>${fmt(transito)}</b><span>Productos en camino</span></div>` : ''}
  </div>`;

  const flecha = k => f.orden === k ? `<span class="flecha">${f.dir > 0 ? '▲' : '▼'}</span>` : '';
  const porDep = f.orden === 'departamento';

  if (f.modo === 'totales') {
    $('#inv-cont').innerHTML = resumen + `<div class="caja tabla-scroll"><table class="ancho" style="min-width:900px">
      <thead><tr><th class="ordenable" data-o="nombre">Producto${flecha('nombre')}</th><th class="ordenable" data-o="departamento">Departamento${flecha('departamento')}</th><th>Unidad</th>
        <th class="num ordenable" data-o="total">Existencia total${flecha('total')}</th><th class="num">Costo</th><th class="num ordenable" data-o="valor">Valor${flecha('valor')}</th>
        <th class="num">Con existencia</th><th class="num ordenable" data-o="agotados">Agotado en${flecha('agotados')}</th></tr></thead>
      <tbody>${prods.map(p => `<tr><td><b>${esc(p.nombre || p.codigo)}</b> <span class="muted" style="font-size:12px">${esc(p.codigo)}</span></td>
        <td>${esc(p.departamento || '—')}</td><td>${esc(p.unidad || '')}</td>
        <td class="num ${p.totalVis < 0 ? 'dif-neg' : ''}"><b>${fmt(p.totalVis)}</b></td><td class="num">${dinero(p.costo)}</td><td class="num">${dinero(p.valorVis)}</td>
        <td class="num">${p.maneja.length - p.agotadas} de ${p.maneja.length}</td>
        <td class="num">${p.agotadas ? `<span class="dif-neg">${p.agotadas} sucursal${p.agotadas === 1 ? '' : 'es'}</span>` : '—'}</td></tr>`).join('')}</tbody></table></div>`;
    ordenarPorEncabezado();
    return;
  }

  // Encabezado en dos niveles: marca y sucursal (nombre corto)
  const bandas = [];
  for (const s of sucs) {
    const g = grupoSuc(s), u = bandas[bandas.length - 1];
    if (u && u.g === g) u.n++; else bandas.push({ g, n: 1 });
  }
  const inicioGrupo = new Set(); let k = 0;
  for (const b of bandas) { inicioGrupo.add(sucs[k].id); k += b.n; }
  const verBandas = f.grupo === 'todas' && bandas.length > 1;

  const celda = (p, s) => {
    const v = p.por[s.id], aj = p.ajuste[s.id], tr = p.transito[s.id];
    const ini = inicioGrupo.has(s.id) ? ' ini-grupo' : '';
    if (v == null) return `<td class="${ini}"><span class="celda nomaneja" title="${esc(s.nombre)} no maneja este producto"></span></td>`;
    const ro = p.reorden?.[s.id];
    const cls = v < 0 ? 'neg' : v === 0 ? 'agotado' : ro?.pedir ? 'bajo' : '';
    const tip = `${s.nombre}: ${fmt(v)} ${p.unidad || ''}${v === 0 ? ' (agotado)' : ''}${ro ? ` · punto de reorden ${fmt(ro.punto)}${ro.sugerido > 0 ? ` · sugerido ${fmt(ro.sugerido)}` : ''}` : ''}${aj ? ` · ajuste pendiente ${aj > 0 ? '+' : ''}${fmt(aj)}` : ''}${tr ? ` · en camino ${fmt(tr)}` : ''}`;
    return `<td class="${ini}"><button class="celda ${cls}" data-c="${esc(p.clave || p.codigo)}" data-s="${s.id}" title="${esc(tip)}" aria-label="${esc(p.nombre + ', ' + tip)}">${aj ? '<span class="marca-aj"></span>' : ''}${fmt(v)}${tr ? `<span class="transito">+${fmt(tr)}</span>` : ''}</button></td>`;
  };
  const fila = p => `<tr>
    <td class="fijo c-prod" title="${esc(p.nombre)} · ${esc(p.codigo)} · ${esc(p.unidad || '')}"><div class="prod-l"><span class="nom">${esc(p.nombre || p.codigo)}</span><span class="cod">${esc(p.codigo)} · ${esc(p.unidad || '')}</span></div></td>
    <td class="fijo c-tot num ${p.totalVis < 0 ? 'neg-t' : ''}">${fmt(p.totalVis)}</td>
    <td class="fijo c-val num">${p.valorVis != null ? dinero(p.valorVis) : '—'}</td>
    ${sucs.map(s => celda(p, s)).join('')}</tr>`;

  let cuerpo = '';
  if (porDep) {
    const grupos = new Map();
    for (const p of prods) { const k = p.departamento || 'Sin departamento'; if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(p); }
    for (const [dep, ps] of grupos) {
      const cerrado = f.cerrados.includes(dep);
      const val = ps.reduce((a, p) => a + (p.valorVis || 0), 0), ag = ps.filter(p => p.agotadas > 0).length;
      cuerpo += `<tr class="dep${cerrado ? ' cerrado' : ''}"><td colspan="${3 + sucs.length}"><button class="dep-b" data-dep="${esc(dep)}" aria-expanded="${!cerrado}"><i>▾</i>${esc(dep)}
        <span class="muted" style="font-weight:400">${ps.length} producto${ps.length === 1 ? '' : 's'} · ${dinero(val)}${ag ? ` · <span style="color:#9A2E1E">${ag} agotado${ag === 1 ? '' : 's'}</span>` : ''}</span></button></td></tr>`;
      if (!cerrado) cuerpo += ps.map(fila).join('');
    }
  } else cuerpo = prods.map(fila).join('');

  $('#inv-cont').innerHTML = resumen + `<div class="caja tabla-scroll matriz" style="--top-cols:${verBandas ? '26px' : '0px'}"><table>
    <thead>
      ${verBandas ? `<tr class="bandas"><th class="fijo c-prod"></th><th class="fijo c-tot"></th><th class="fijo c-val"></th>
        ${bandas.map(b => `<th class="banda" colspan="${b.n}">${esc(b.g)}</th>`).join('')}</tr>` : ''}
      <tr class="cols">
        <th class="fijo c-prod ordenable" data-o="nombre" style="text-align:left">Producto${flecha('nombre')}</th>
        <th class="fijo c-tot ordenable" data-o="total">Total${flecha('total')}</th>
        <th class="fijo c-val ordenable" data-o="valor">Valor${flecha('valor')}</th>
        ${sucs.map(s => `<th class="suc${inicioGrupo.has(s.id) ? ' ini-grupo' : ''}" title="${esc(s.nombre)} · ${s.ultimo_sync ? 'existencias al ' + esc(fechaHora(s.ultimo_sync)) : 'sin datos'}"><span>${esc(nombreCorto(s.nombre))}</span></th>`).join('')}
      </tr></thead>
    <tbody>${cuerpo}</tbody></table></div>
    <div class="leyenda">
      <span><i style="background:#FBF1DC;border-color:#EBD6A8"></i>En punto de reorden</span>
      <span><i style="background:#FBEDEA;border-color:#F0C9C1"></i>Agotado</span>
      <span><i style="background:var(--tomate);border-color:var(--tomate)"></i>Existencia negativa</span>
      <span><i style="background:repeating-linear-gradient(135deg,#fff 0 5px,#E6E8E3 5px 6px)"></i>La sucursal no maneja el producto</span>
      <span><i style="background:var(--ambar);border-radius:50%;width:8px;height:8px;border:0"></i>Ajuste pendiente</span>
      <span style="color:var(--azul);font-weight:600">+n</span><span style="margin-left:-12px">en camino</span>
      <span class="muted">Toca una celda para ajustar o pedir</span>
    </div>`;

  const m = $('#inv-cont .matriz');
  m.addEventListener('click', e => {
    const dep = e.target.closest('.dep-b');
    if (dep) {
      const k = dep.dataset.dep, c = S.filtroInv.cerrados;
      S.filtroInv.cerrados = c.includes(k) ? c.filter(x => x !== k) : [...c, k];
      const top = m.scrollTop; pintarMatriz(); $('#inv-cont .matriz').scrollTop = top;
      return;
    }
    const b = e.target.closest('button.celda');
    if (b) popoverCelda(b);
  });
  ordenarPorEncabezado();
}

function ordenarPorEncabezado() {
  $$('#inv-cont th.ordenable').forEach(th => th.onclick = () => {
    const f = S.filtroInv, k = th.dataset.o;
    if (f.orden === k && k !== 'departamento') f.dir = -f.dir;
    else { f.orden = k; f.dir = ['total', 'valor', 'agotados'].includes(k) ? -1 : 1; }
    const sel = $('#f-orden'); if (sel) sel.value = k;
    pintarMatriz();
  });
}

let popEl = null;
function cerrarPopover() { popEl?.remove(); popEl = null; }
document.addEventListener('mousedown', e => { if (popEl && !popEl.contains(e.target) && !e.target.closest('button.celda')) cerrarPopover(); });

function popoverCelda(btn) {
  cerrarPopover();
  const p = S.consolidado.productos.find(x => (x.clave || x.codigo) === btn.dataset.c);
  const s = S.consolidado.sucursales.find(x => x.id === +btn.dataset.s);
  const v = p.por[s.id];
  popEl = document.createElement('div');
  popEl.className = 'popover';
  popEl.innerHTML = `<b>${esc(p.nombre || p.codigo)}</b><div class="muted">${esc(s.nombre)}</div>
    <div style="margin-top:8px">Existencia en Wansoft: <b>${v == null ? 'no lo maneja' : fmt(v) + ' ' + esc(p.unidad || '')}</b></div>
    ${p.ajuste[s.id] ? `<div>Ajuste pendiente: <b>${p.ajuste[s.id] > 0 ? '+' : ''}${fmt(p.ajuste[s.id])}</b></div>` : ''}
    ${p.transito[s.id] ? `<div>En camino: <b>${fmt(p.transito[s.id])}</b></div>` : ''}
    <div class="acc"><button class="btn mini" data-a="aj">Ajustar</button><button class="btn mini primario" data-a="oc">Pedir</button></div>`;
  document.body.appendChild(popEl);
  const r = btn.getBoundingClientRect();
  popEl.style.top = Math.min(window.innerHeight - popEl.offsetHeight - 10, r.bottom + 6) + 'px';
  popEl.style.left = Math.max(10, Math.min(window.innerWidth - 290, r.left - 100)) + 'px';
  const prod = { codigo: p.codigo, nombre: p.nombre, unidad: p.unidad, costo: p.costo, existencia_sucursal: v ?? 0 };
  popEl.querySelector('[data-a=aj]').onclick = () => { cerrarPopover(); editorAjuste(s.id, [prod]); };
  popEl.querySelector('[data-a=oc]').onclick = () => { cerrarPopover(); editorOrden(null, { sucursal_id: s.id, lineas: [{ ...prod, cantidad: '', costo_unitario: p.costo || 0 }] }); };
  popEl.querySelector('button').focus();
}

function descargarCSV() {
  const d = S.consolidado;
  if (!d) return;
  const sucs = sucursalesVisibles();
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const filas = [['Código', 'Producto', 'Unidad', 'Departamento', 'Costo', 'Total', ...sucs.map(s => s.nombre)].map(q).join(',')];
  for (const p of productosVisibles(sucs.map(s => s.id))) {
    filas.push([p.codigo, p.nombre, p.unidad, p.departamento, p.costo, p.totalVis, ...sucs.map(s => p.por[s.id] ?? '')].map(q).join(','));
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + filas.join('\n')], { type: 'text/csv' }));
  a.download = `inventario-consolidado-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
}
