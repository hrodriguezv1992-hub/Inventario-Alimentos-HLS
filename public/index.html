const fAj = { estado: 'pendiente', sucursal_id: '' };
async function vAjustes() {
  $('#vista').innerHTML = cabeza('Ajustes de inventario',
    'Registra conteos y mermas por sucursal. Wansoft no recibe ajustes por su API: usa "Archivo para Wansoft" para descargar la carga de inventario físico, súbela en Wansoft y confirma aquí.',
    `${puedeCapturarAj() ? '<button class="btn" id="b-carga-ws">Archivo para Wansoft</button>' : ''}<button class="btn primario" id="b-nuevo-aj">Nuevo ajuste o conteo</button>`) +
    `<div class="filtros">
      <div class="chips" role="group" aria-label="Estado">${[['pendiente', 'Pendientes'], ['capturado', 'Capturados'], ['cancelado', 'Cancelados'], ['', 'Todos']].map(([k, t]) =>
        `<button class="chip" data-e="${k}" aria-pressed="${fAj.estado === k}">${t}</button>`).join('')}</div>
      <select id="aj-suc" aria-label="Sucursal">${opcionesSucursal(fAj.sucursal_id, 'Todas las sucursales')}</select>
    </div><div id="aj-cont"><div class="vacio"><span class="carga"></span></div></div>`;
  $('#b-nuevo-aj').onclick = () => editorAjuste();
  $('#b-carga-ws')?.addEventListener('click', () => panelCargaWansoft(fAj.sucursal_id));
  $$('[data-e]').forEach(b => b.onclick = () => { fAj.estado = b.dataset.e; vAjustes(); });
  $('#aj-suc').onchange = e => { fAj.sucursal_id = e.target.value; vAjustes(); };
  try {
    const p = new URLSearchParams(); if (fAj.estado) p.set('estado', fAj.estado); if (fAj.sucursal_id) p.set('sucursal_id', fAj.sucursal_id);
    const rows = await api('/ajustes?' + p);
    if (!rows.length) {
      $('#aj-cont').innerHTML = `<div class="caja vacio"><b>${fAj.estado === 'pendiente' ? 'No hay ajustes pendientes' : 'Sin ajustes'}</b>Cuando hagas un conteo físico, captura aquí lo que encontraste.</div>`;
      return;
    }
    const valor = rows.filter(r => r.estado === 'pendiente').reduce((a, r) => a + Number(r.diferencia) * Number(r.costo || 0), 0);
    $('#aj-cont').innerHTML = (fAj.estado === 'pendiente' ? `<div class="resumen"><div><b>${rows.length}</b><span>Ajustes por capturar en Wansoft</span></div>
      <div><b class="${valor < 0 ? 'dif-neg' : ''}">${dinero(valor)}</b><span>Impacto a costo</span></div>
      <div><b>${rows.filter(r => r.coincide_wansoft).length}</b><span>Wansoft ya coincide</span></div></div>` : '') +
      `<div class="caja tabla-scroll"><table class="ancho"><thead><tr><th>Folio</th><th>Sucursal</th><th>Producto</th><th class="num">Sistema</th><th class="num">Físico</th><th class="num">Diferencia</th><th class="num">Impacto</th><th>Motivo</th><th>Registró</th><th>Estado</th>${puedeCapturarAj() ? '<th></th>' : ''}</tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td style="white-space:nowrap"><b>${esc(r.folio)}</b></td><td>${esc(r.sucursal)}</td>
        <td style="min-width:200px">${esc(r.nombre || r.codigo)}<br><span class="muted">${esc(r.codigo)}</span></td>
        <td class="num">${fmt(r.existencia_sistema)}</td><td class="num">${fmt(r.existencia_fisica)}</td>
        <td class="num ${r.diferencia < 0 ? 'dif-neg' : 'dif-pos'}">${r.diferencia > 0 ? '+' : ''}${fmt(r.diferencia)}</td>
        <td class="num">${r.costo != null ? dinero(r.diferencia * r.costo) : '—'}</td>
        <td style="min-width:210px">${esc(r.motivo)}${r.comentario ? `<br><span class="muted" style="font-size:13px">${esc(r.comentario)}</span>` : ''}</td>
        <td style="min-width:140px">${esc(r.creado_por_nombre || '')}<br><span class="muted" style="font-size:13px">${fechaHora(r.creado_en)}</span></td>
        <td><span class="est ${r.estado}">${ESTADO_AJ[r.estado]}</span>${r.coincide_wansoft ? '<br><span class="est ok" title="La existencia actual en Wansoft ya es igual al conteo físico">Wansoft ya coincide</span>' : ''}
          ${r.resuelto_por_nombre ? `<br><span class="muted">${esc(r.resuelto_por_nombre)}, ${fechaHora(r.resuelto_en)}</span>` : ''}</td>
        ${puedeCapturarAj() ? `<td style="white-space:nowrap">${r.estado === 'pendiente'
          ? `<button class="btn mini" data-aj="${r.id}" data-to="capturado">Marcar capturado</button> <button class="btn mini texto" data-aj="${r.id}" data-to="cancelado">Cancelar</button>`
          : `<button class="btn mini texto" data-aj="${r.id}" data-to="pendiente">Regresar a pendiente</button>`}</td>` : ''}
      </tr>`).join('')}</tbody></table></div>`;
    $$('[data-aj]').forEach(b => b.onclick = () => accion(b, async () => {
      await api(`/ajustes/${b.dataset.aj}`, { method: 'PATCH', body: { estado: b.dataset.to } });
      toast(b.dataset.to === 'capturado' ? 'Ajuste marcado como capturado' : b.dataset.to === 'cancelado' ? 'Ajuste cancelado' : 'Ajuste regresado a pendiente');
      vAjustes();
    }));
  } catch (e) { $('#aj-cont').innerHTML = `<div class="aviso error">${esc(e.message)}</div>`; }
}

function editorAjuste(sucId = '', inicial = []) {
  const items = inicial.map(p => ({ ...p, fisica: '' }));
  const misSucs = acotado() ? S.user.sucursales : null;
  if (!sucId && misSucs?.length === 1) sucId = misSucs[0];
  const panel = abrirPanel(`
    <div class="panel-cab"><div><h2>Nuevo ajuste o conteo</h2><div class="muted">Captura la cantidad física que contaste. La diferencia contra Wansoft se calcula sola.</div></div>${botonCerrar}</div>
    <div class="panel-cuerpo">
      <div class="rejilla">
        <label class="campo">Sucursal<select id="aj-s">${opcionesSucursal(sucId)}</select></label>
        <label class="campo">Motivo<select id="aj-m">${S.motivos.map(m => `<option>${esc(m)}</option>`).join('')}</select></label>
      </div>
      <label class="campo">Comentario (opcional)<input type="text" id="aj-c" placeholder="Ej. conteo de cierre de mes"></label>
      <div><label class="campo" style="margin-bottom:4px">Agregar producto</label><div id="aj-bus"></div></div>
      <div class="caja tabla-scroll" id="aj-items"></div>
    </div>
    <div class="panel-pie"><button class="btn primario" id="aj-guardar">Guardar ajuste</button><button class="btn" onclick="cerrarPanel()">Cancelar</button><span class="muted" id="aj-res" style="align-self:center"></span></div>`, { angosto: false });

  const pintar = () => {
    if (!items.length) { $('#aj-items', panel).innerHTML = `<div class="vacio">Busca los productos que contaste.</div>`; $('#aj-res', panel).textContent = ''; return; }
    $('#aj-items', panel).innerHTML = `<table><thead><tr><th>Producto</th><th class="num">En Wansoft</th><th class="num">Físico</th><th class="num">Diferencia</th><th></th></tr></thead><tbody>
      ${items.map((it, i) => {
        const dif = it.fisica === '' ? null : Number(it.fisica) - Number(it.existencia_sucursal || 0);
        return `<tr><td><b>${esc(it.nombre || it.codigo)}</b><br><span class="muted">${esc(it.codigo)} · ${esc(it.unidad || '')}</span></td>
        <td class="num">${fmt(it.existencia_sucursal ?? 0)}</td>
        <td class="num"><input type="number" min="0" step="any" data-i="${i}" value="${esc(it.fisica)}" aria-label="Cantidad física de ${esc(it.nombre)}"></td>
        <td class="num ${dif == null ? '' : dif < 0 ? 'dif-neg' : dif > 0 ? 'dif-pos' : ''}" data-dif="${i}">${dif == null ? '—' : (dif > 0 ? '+' : '') + fmt(dif)}</td>
        <td><button class="btn mini texto" data-quitar="${i}">Quitar</button></td></tr>`;
      }).join('')}</tbody></table>`;
    $$('input[data-i]', panel).forEach(inp => inp.addEventListener('input', () => {
      const it = items[inp.dataset.i]; it.fisica = inp.value;
      const dif = it.fisica === '' ? null : Number(it.fisica) - Number(it.existencia_sucursal || 0);
      const td = $(`[data-dif="${inp.dataset.i}"]`, panel);
      td.textContent = dif == null ? '—' : (dif > 0 ? '+' : '') + fmt(dif);
      td.className = 'num ' + (dif == null ? '' : dif < 0 ? 'dif-neg' : dif > 0 ? 'dif-pos' : '');
    }));
    $$('[data-quitar]', panel).forEach(b => b.onclick = () => { items.splice(b.dataset.quitar, 1); pintar(); });
  };
  const sel = $('#aj-s', panel);
  montarBuscador($('#aj-bus', panel), {
    sucursal: () => sel.value,
    alElegir: p => {
      if (!sel.value) return toast('Primero elige la sucursal', 'error');
      if (items.some(x => x.codigo === p.codigo)) return toast('Ese producto ya está en la lista');
      items.push({ ...p, fisica: '' }); pintar();
      $(`input[data-i="${items.length - 1}"]`, panel)?.focus();
    },
  });
  sel.onchange = async () => {
    // Al cambiar de sucursal se recalcula lo que dice Wansoft
    for (const it of items) {
      const r = await api(`/inventario/productos?q=${encodeURIComponent(it.codigo)}&sucursal_id=${sel.value}`).catch(() => []);
      it.existencia_sucursal = r.find(x => x.codigo === it.codigo)?.existencia_sucursal ?? 0;
    }
    pintar();
  };
  pintar();
  $('#aj-guardar', panel).onclick = e => accion(e.currentTarget, async () => {
    if (!sel.value) throw new Error('Elige la sucursal');
    const conCant = items.filter(i => i.fisica !== '');
    if (!conCant.length) throw new Error('Captura la cantidad física de al menos un producto');
    const r = await api('/ajustes', { method: 'POST', body: {
      sucursal_id: +sel.value, motivo: $('#aj-m', panel).value, comentario: $('#aj-c', panel).value,
      items: conCant.map(i => ({ codigo: i.codigo, nombre: i.nombre, existencia_fisica: Number(i.fisica) })) } });
    cerrarPanel();
    toast(r.creados.length ? `${r.creados.length} ajuste${r.creados.length > 1 ? 's' : ''} guardado${r.creados.length > 1 ? 's' : ''}${r.sin_diferencia ? ` · ${r.sin_diferencia} sin diferencia` : ''}` : 'Todo coincide con Wansoft, no se generaron ajustes');
    if (S.vista === 'ajustes') vAjustes(); else if (S.vista === 'inventario') cargarConsolidado();
  });
}

// ════════════════════════════════════════════════════════════════
//  Vista: Órdenes de compra
// ════════════════════════════════════════════════════════════════
const fOC = { estado: 'abiertas', sucursal_id: '', q: '' };
async function vOrdenes() {
  $('#vista').innerHTML = cabeza('Órdenes de compra', 'Cada orden tiene folio, historial y el avance de lo recibido. La recepción se confirma contra las entradas de compra registradas en Wansoft.',
    `<button class="btn primario" id="b-nueva-oc">Nueva orden de compra</button>`) +
    `<div class="filtros">
      <div class="chips" role="group" aria-label="Estado">${[['abiertas', 'Abiertas'], ['borrador', 'Borradores'], ['enviada', 'Enviadas'], ['recibida_parcial', 'Parciales'], ['recibida', 'Recibidas'], ['cancelada', 'Canceladas'], ['', 'Todas']].map(([k, t]) =>
        `<button class="chip" data-e="${k}" aria-pressed="${fOC.estado === k}">${t}</button>`).join('')}</div>
      <select id="oc-suc" aria-label="Sucursal">${opcionesSucursal(fOC.sucursal_id, 'Todas las sucursales')}</select>
      <input type="search" id="oc-q" placeholder="Folio, proveedor o sucursal" value="${esc(fOC.q)}" aria-label="Buscar orden">
    </div><div id="oc-cont"><div class="vacio"><span class="carga"></span></div></div>`;
  $('#b-nueva-oc').onclick = () => editorOrden();
  $$('[data-e]').forEach(b => b.onclick = () => { fOC.estado = b.dataset.e; vOrdenes(); });
  $('#oc-suc').onchange = e => { fOC.sucursal_id = e.target.value; vOrdenes(); };
  let t; $('#oc-q').oninput = e => { clearTimeout(t); t = setTimeout(() => { fOC.q = e.target.value; cargarOrdenes(); }, 250); };
  cargarOrdenes();
}
async function cargarOrdenes() {
  try {
    const p = new URLSearchParams();
    if (fOC.estado && fOC.estado !== 'abiertas') p.set('estado', fOC.estado);
    if (fOC.sucursal_id) p.set('sucursal_id', fOC.sucursal_id);
    if (fOC.q) p.set('q', fOC.q);
    let rows = await api('/ordenes?' + p);
    if (fOC.estado === 'abiertas') rows = rows.filter(r => ['borrador', 'enviada', 'recibida_parcial'].includes(r.estado));
    if (!rows.length) {
      $('#oc-cont').innerHTML = `<div class="caja vacio"><b>No hay órdenes ${fOC.estado === 'abiertas' ? 'abiertas' : 'con ese filtro'}</b>Crea una orden desde aquí o desde una celda del inventario consolidado.</div>`;
      return;
    }
    const hoy = new Date().toISOString().slice(0, 10);
    $('#oc-cont').innerHTML = `<div class="caja tabla-scroll"><table><thead><tr><th>Folio</th><th>Sucursal</th><th>Proveedor</th><th>Estado</th><th>Recibido</th><th class="num">Total</th><th>Entrega</th><th>Creada</th></tr></thead>
      <tbody>${rows.map(r => {
        const pct = r.piezas > 0 ? Math.min(100, Math.round(100 * r.recibidas / r.piezas)) : 0;
        const tarde = r.fecha_entrega && r.fecha_entrega.slice(0, 10) < hoy && ['enviada', 'recibida_parcial'].includes(r.estado);
        return `<tr class="clic" data-oc="${r.id}" tabindex="0">
          <td><b>${esc(r.folio)}</b></td><td>${esc(r.sucursal)}</td><td>${esc(r.proveedor || '—')}</td>
          <td><span class="est ${r.estado}">${ESTADO_OC[r.estado]}</span></td>
          <td><div style="display:flex;gap:8px;align-items:center"><div class="barra" aria-hidden="true"><i style="width:${pct}%"></i></div><span class="muted">${pct}%</span></div></td>
          <td class="num">${dinero(r.total)}</td>
          <td>${r.fecha_entrega ? `<span class="${tarde ? 'dif-neg' : ''}">${fecha(r.fecha_entrega)}${tarde ? ' · atrasada' : ''}</span>` : '—'}</td>
          <td>${fecha(r.creado_en)}<br><span class="muted">${esc(r.creado_por_nombre || '')}</span></td></tr>`;
      }).join('')}</tbody></table></div>`;
    $$('[data-oc]').forEach(tr => {
      tr.onclick = () => detalleOrden(tr.dataset.oc);
      tr.onkeydown = e => { if (e.key === 'Enter') detalleOrden(tr.dataset.oc); };
    });
  } catch (e) { $('#oc-cont').innerHTML = `<div class="aviso error">${esc(e.message)}</div>`; }
}

function editorOrden(oc = null, pre = {}) {
  const base = oc || { sucursal_id: pre.sucursal_id || '', proveedor_id: '', fecha_entrega: '', notas: '', lineas: pre.lineas || [] };
  const misSucs = acotado() ? S.user.sucursales : null;
  if (!base.sucursal_id && misSucs?.length === 1) base.sucursal_id = misSucs[0];

  // Lo que se va a pedir, por código. Lo que ya traía la orden (o el producto elegido desde el inventario) se precarga.
  const pedido = new Map(base.lineas.map(l => [l.codigo, {
    codigo: l.codigo, nombre: l.nombre, unidad: l.unidad,
    cantidad: l.cantidad ?? '', costo_unitario: l.costo_unitario ?? l.costo ?? 0,
  }]));
  let lista = [];               // todos los productos de la sucursal
  const vista = { q: '', dep: '', filtro: 'todos', origen: '' };

  const panel = abrirPanel(`
    <div class="panel-cab"><div><h2>${oc ? 'Editar ' + esc(oc.folio) : 'Nueva orden de compra'}</h2><div class="muted">Elige la sucursal y escribe cuánto pedir de cada producto. Se guarda como borrador hasta que la envíes.</div></div>${botonCerrar}</div>
    <div class="panel-cuerpo">
      <div class="rejilla">
        <label class="campo">Sucursal que recibe<select id="oc-s">${opcionesSucursal(base.sucursal_id)}</select></label>
        <label class="campo">Proveedor<select id="oc-p">${opcionesProveedor(base.proveedor_id)}</select></label>
        <label class="campo">Fecha de entrega esperada<input type="date" id="oc-f" value="${esc((base.fecha_entrega || '').slice(0, 10))}"></label>
      </div>
      <label class="campo">Notas para el proveedor o el almacén<textarea id="oc-n" rows="2">${esc(base.notas || '')}</textarea></label>
      <div class="filtros" style="margin:0">
        <input type="search" id="oc-q" placeholder="Filtrar por nombre o código" aria-label="Filtrar productos">
        <select id="oc-dep" aria-label="Departamento"><option value="">Todos los departamentos</option></select>
        <div class="chips" role="group" aria-label="Mostrar">
          <button class="chip" data-f="todos" aria-pressed="true">Todos</button>
          <button class="chip" data-f="agotados">Agotados</button>
          <button class="chip oculto" data-f="sugerido" id="oc-chip-sug">Para pedir</button>
          <button class="chip" data-f="pedido">En el pedido</button>
        </div>
        <span style="flex:1"></span>
        <select id="oc-orig" class="oculto" aria-label="Quién surte"><option value="">Lo surte: todos</option><option value="cedis">Lo surte CEDIS</option><option value="proveedor">Lo surte el proveedor</option></select>
        <button class="btn oculto" id="oc-llenar">Llenar con sugerido</button>
      </div>
      <div class="caja tabla-scroll" id="oc-items" style="max-height:calc(100vh - 430px);min-height:200px"></div>
    </div>
    <div class="panel-pie">
      <button class="btn primario" id="oc-enviar">Guardar y enviar</button>
      <button class="btn" id="oc-borrador">Guardar borrador</button>
      <button class="btn" onclick="cerrarPanel()">Cancelar</button>
      <span style="margin-left:auto;align-self:center"><span id="oc-cuenta" class="muted"></span> Total: <b id="oc-total">$0.00</b></span>
    </div>`);

  const sel = $('#oc-s', panel);
  const lineasPedido = () => [...pedido.values()].filter(l => Number(l.cantidad) > 0);
  const actualizarTotales = () => {
    const ls = lineasPedido();
    $('#oc-total', panel).textContent = dinero(ls.reduce((a, l) => a + Number(l.cantidad) * (Number(l.costo_unitario) || 0), 0));
    $('#oc-cuenta', panel).textContent = ls.length ? `${ls.length} producto${ls.length === 1 ? '' : 's'} ·` : '';
  };

  const pintar = () => {
    actualizarTotales();
    const cont = $('#oc-items', panel);
    if (!sel.value) { cont.innerHTML = `<div class="vacio">Elige la sucursal para ver sus productos y existencias.</div>`; return; }
    const q = vista.q.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const filas = lista.filter(p =>
      (!q || norm(p.nombre).includes(q) || norm(p.codigo).includes(q)) &&
      (!vista.dep || p.departamento === vista.dep) &&
      (vista.filtro !== 'agotados' || Number(p.existencia) <= 0) &&
      (vista.filtro !== 'sugerido' || p.reorden?.sugerido > 0) &&
      (!vista.origen || p.reorden?.origen === vista.origen || (!p.reorden && vista.origen === 'cedis')) &&
      (vista.filtro !== 'pedido' || Number(pedido.get(p.codigo)?.cantidad) > 0));
    if (!filas.length) {
      cont.innerHTML = `<div class="vacio">${lista.length ? 'Ningún producto coincide con el filtro.' : 'Esta sucursal no tiene productos todavía. Actualízala desde Sucursales y Wansoft.'}</div>`;
      return;
    }
    const conReorden = lista.some(p => p.reorden);
    cont.innerHTML = `<table><thead><tr><th>Producto</th><th>Departamento</th><th class="num">Existencia</th><th class="num">En camino</th>${conReorden ? '<th class="num">Sugerido</th>' : ''}<th class="num">Pedir</th><th class="num">Costo unitario</th><th class="num">Importe</th></tr></thead><tbody>
      ${filas.map(p => {
        const l = pedido.get(p.codigo);
        const ex = Number(p.existencia);
        const cant = l?.cantidad ?? '';
        const costo = l?.costo_unitario ?? (p.costo != null ? Number(p.costo) : 0);
        return `<tr${Number(cant) > 0 ? ' style="background:var(--albahaca-claro)"' : ''}>
          <td><b>${esc(p.nombre || p.codigo)}</b><br><span class="muted">${esc(p.codigo)} · ${esc(p.unidad || '')}</span></td>
          <td>${esc(p.departamento || '—')}</td>
          <td class="num ${ex <= 0 ? 'dif-neg' : ''}">${ex <= 0 ? (ex < 0 ? fmt(ex) : 'Agotado') : fmt(ex)}</td>
          <td class="num" style="color:var(--azul)">${Number(p.en_camino) > 0 ? fmt(p.en_camino) : ''}</td>
          ${conReorden ? `<td class="num" title="${p.reorden ? esc(`Punto de reorden ${fmt(p.reorden.punto)} · objetivo ${fmt(p.reorden.objetivo)} · ${p.reorden.metodo === 'receta' ? 'por receta' : 'mínimo y máximo'} · lo surte ${p.reorden.origen === 'proveedor' ? 'el proveedor' : 'CEDIS'}`) : 'Sin punto de reorden'}">${p.reorden?.sugerido > 0
            ? `<button type="button" class="btn texto mini" data-usar="${esc(p.codigo)}" style="padding:0 2px;font-weight:600">${fmt(p.reorden.sugerido)}</button>${p.reorden.paquetes ? `<br><span class="muted" style="font-size:11.5px">${p.reorden.paquetes} ${esc((p.reorden.presNombre || 'paq.').toLowerCase())}</span>` : ''}`
            : `<span class="muted">${p.reorden ? '—' : ''}</span>`}</td>` : ''}
          <td class="num"><input type="number" min="0" step="any" data-c="${esc(p.codigo)}" data-k="cantidad" value="${esc(cant)}" aria-label="Cantidad a pedir de ${esc(p.nombre)}"></td>
          <td class="num"><input type="number" min="0" step="any" data-c="${esc(p.codigo)}" data-k="costo_unitario" value="${esc(costo)}" aria-label="Costo de ${esc(p.nombre)}"></td>
          <td class="num" data-imp="${esc(p.codigo)}">${Number(cant) > 0 ? dinero(Number(cant) * (Number(costo) || 0)) : ''}</td></tr>`;
      }).join('')}</tbody></table>`;
    $$('input[data-c]', cont).forEach(inp => inp.addEventListener('input', () => {
      const p = lista.find(x => x.codigo === inp.dataset.c);
      const l = pedido.get(p.codigo) || { codigo: p.codigo, nombre: p.nombre, unidad: p.unidad, cantidad: '', costo_unitario: p.costo != null ? Number(p.costo) : 0 };
      l[inp.dataset.k] = inp.value;
      pedido.set(p.codigo, l);
      const tr = inp.closest('tr');
      tr.style.background = Number(l.cantidad) > 0 ? 'var(--albahaca-claro)' : '';
      $(`[data-imp="${CSS.escape(p.codigo)}"]`, cont).textContent = Number(l.cantidad) > 0 ? dinero(Number(l.cantidad) * (Number(l.costo_unitario) || 0)) : '';
      actualizarTotales();
    }));
    // Tocar el sugerido lo pone en "Pedir"
    $$('[data-usar]', cont).forEach(b => b.onclick = () => {
      const inp = $(`input[data-c="${CSS.escape(b.dataset.usar)}"][data-k=cantidad]`, cont);
      inp.value = lista.find(x => x.codigo === b.dataset.usar).reorden.sugerido; inp.dispatchEvent(new Event('input')); inp.focus();
    });
    // Enter baja al siguiente producto
    $$('input[data-k=cantidad]', cont).forEach((inp, i, all) => inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); all[i + 1]?.focus(); all[i + 1]?.select(); }
    }));
  };

  const cargarLista = async () => {
    lista = [];
    if (!sel.value) { pintar(); return; }
    $('#oc-items', panel).innerHTML = `<div class="vacio"><span class="carga"></span></div>`;
    try {
      lista = await api(`/inventario/sucursal/${sel.value}/productos`);
      // Productos de la orden que ya no estén en el catálogo se conservan
      for (const l of pedido.values()) if (!lista.some(p => p.codigo === l.codigo)) lista.unshift({ ...l, existencia: 0, en_camino: 0, costo: l.costo_unitario });
      const deps = [...new Set(lista.map(p => p.departamento).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
      $('#oc-dep', panel).innerHTML = '<option value="">Todos los departamentos</option>' + deps.map(d => `<option>${esc(d)}</option>`).join('');
      vista.dep = '';
      const hayReorden = lista.some(p => p.reorden);
      ['#oc-chip-sug', '#oc-orig', '#oc-llenar'].forEach(id => $(id, panel).classList.toggle('oculto', !hayReorden));
    } catch (e) { toast(e.message, 'error'); }
    pintar();
    // Si se llegó desde una celda del inventario, enfocar ese producto
    const primero = [...pedido.keys()][0];
    if (primero && !oc) { vista.filtro = 'pedido'; $$('[data-f]', panel).forEach(x => x.setAttribute('aria-pressed', x.dataset.f === 'pedido')); pintar(); $('input[data-k=cantidad]', panel)?.focus(); }
  };

  $('#oc-orig', panel).onchange = e => { vista.origen = e.target.value; pintar(); };
  $('#oc-llenar', panel).onclick = () => {
    let n = 0;
    for (const p of lista) {
      if (!(p.reorden?.sugerido > 0)) continue;
      if (vista.origen && p.reorden.origen !== vista.origen) continue;
      const l = pedido.get(p.codigo);
      if (l && Number(l.cantidad) > 0) continue;   // no pisa lo que ya escribiste
      pedido.set(p.codigo, { codigo: p.codigo, nombre: p.nombre, unidad: p.unidad, cantidad: p.reorden.sugerido, costo_unitario: l?.costo_unitario ?? (p.costo != null ? Number(p.costo) : 0) });
      n++;
    }
    vista.filtro = 'pedido'; $$('[data-f]', panel).forEach(x => x.setAttribute('aria-pressed', x.dataset.f === 'pedido'));
    pintar(); toast(n ? `${n} producto${n === 1 ? '' : 's'} con la cantidad sugerida` : 'No hay sugeridos pendientes');
  };
  sel.addEventListener('change', () => {
    if (lineasPedido().length && !confirm('Cambiar de sucursal conserva las cantidades que ya escribiste. ¿Continuar?')) return;
    cargarLista();
  });
  let t;
  $('#oc-q', panel).addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { vista.q = e.target.value.trim(); pintar(); }, 150); });
  $('#oc-dep', panel).addEventListener('change', e => { vista.dep = e.target.value; pintar(); });
  $$('[data-f]', panel).forEach(b => b.addEventListener('click', () => {
    vista.filtro = b.dataset.f; $$('[data-f]', panel).forEach(x => x.setAttribute('aria-pressed', x === b)); pintar();
  }));
  cargarLista();

  const guardar = (enviar) => async () => {
    if (!sel.value) throw new Error('Elige la sucursal que recibe');
    const ls = lineasPedido();
    if (!ls.length) throw new Error('Escribe la cantidad a pedir de al menos un producto');
    const body = { sucursal_id: +sel.value, proveedor_id: $('#oc-p', panel).value || null, fecha_entrega: $('#oc-f', panel).value || null,
      notas: $('#oc-n', panel).value, lineas: ls.map(l => ({ codigo: l.codigo, nombre: l.nombre, unidad: l.unidad, cantidad: Number(l.cantidad), costo_unitario: Number(l.costo_unitario) || 0 })) };
    let id;
    if (oc) {
      await api(`/ordenes/${oc.id}`, { method: 'PUT', body });
      if (enviar) await api(`/ordenes/${oc.id}/enviar`, { method: 'POST' });
      id = oc.id;
      toast(enviar ? `${oc.folio} enviada` : 'Cambios guardados');
    } else {
      const r = await api('/ordenes', { method: 'POST', body: { ...body, enviar } });
      id = r.id;
      toast(enviar ? `${r.folio} creada y enviada` : `${r.folio} guardada como borrador`);
    }
    if (S.vista === 'ordenes') cargarOrdenes(); else if (S.vista === 'inventario') cargarConsolidado();
    detalleOrden(id);
  };
  $('#oc-enviar', panel).onclick = e => accion(e.currentTarget, guardar(true));
  $('#oc-borrador', panel).onclick = e => accion(e.currentTarget, guardar(false));
}

async function detalleOrden(id) {
  let oc;
  try { oc = await api('/ordenes/' + id); } catch (e) { return toast(e.message, 'error'); }
  const abierta = ['enviada', 'recibida_parcial'].includes(oc.estado);
  const pasos = [['borrador', 'Borrador'], ['enviada', 'Enviada'], ['recibida_parcial', 'Recibiendo'], ['recibida', 'Recibida']];
  const idx = pasos.findIndex(p => p[0] === oc.estado);
  const piezas = oc.lineas.reduce((a, l) => a + Number(l.cantidad), 0);
  const rec = oc.lineas.reduce((a, l) => a + Math.min(Number(l.cantidad_recibida), Number(l.cantidad)), 0);

  const panel = abrirPanel(`
    <div class="panel-cab"><div>
      <h2>${esc(oc.folio)} <span class="est ${oc.estado}" style="vertical-align:3px">${ESTADO_OC[oc.estado]}</span></h2>
      <div class="muted">${esc(oc.sucursal)} · ${esc(oc.proveedor || 'Sin proveedor')} · ${dinero(oc.total)}</div></div>${botonCerrar}</div>
    <div class="panel-cuerpo">
      ${oc.estado === 'cancelada'
        ? `<ol class="pasos"><li class="cancelada">Cancelada ${fechaHora(oc.cerrada_en)}</li></ol>`
        : `<ol class="pasos">${pasos.map((p, i) => `<li class="${i < idx ? 'hecho' : i === idx ? 'actual' : ''}">${p[1]}</li>`).join('')}</ol>`}
      <div class="rejilla">
        <div><span class="muted">Creada</span><br>${fechaHora(oc.creado_en)} por ${esc(oc.creado_por_nombre || '—')}</div>
        <div><span class="muted">Enviada</span><br>${fechaHora(oc.enviada_en)}</div>
        <div><span class="muted">Entrega esperada</span><br>${fecha(oc.fecha_entrega)}</div>
        <div><span class="muted">Recibido</span><br>${fmt(rec)} de ${fmt(piezas)} (${piezas ? Math.round(100 * rec / piezas) : 0}%)</div>
      </div>
      ${oc.notas ? `<div class="aviso">${esc(oc.notas)}</div>` : ''}

      <div class="caja tabla-scroll"><table><thead><tr><th>Producto</th><th class="num">Pedido</th><th class="num">Recibido</th><th class="num">Falta</th><th class="num">Costo</th><th class="num">Importe</th>${abierta ? '<th class="num">Recibir ahora</th>' : ''}</tr></thead>
        <tbody>${oc.lineas.map(l => {
          const falta = Math.max(0, l.cantidad - l.cantidad_recibida);
          return `<tr><td><b>${esc(l.nombre || l.codigo)}</b><br><span class="muted">${esc(l.codigo)} · ${esc(l.unidad || '')}</span></td>
          <td class="num">${fmt(l.cantidad)}</td><td class="num">${fmt(l.cantidad_recibida)}</td>
          <td class="num ${falta > 0 ? 'dif-neg' : ''}">${falta > 0 ? fmt(falta) : 'Completo'}</td>
          <td class="num">${dinero(l.costo_unitario)}</td><td class="num">${dinero(l.cantidad * l.costo_unitario)}</td>
          ${abierta ? `<td class="num"><input type="number" min="0" step="any" data-rec="${l.id}" placeholder="${falta > 0 ? fmt(falta) : '0'}" aria-label="Recibir ${esc(l.nombre)}"></td>` : ''}</tr>`;
        }).join('')}</tbody></table></div>
      <div><h3 style="margin-bottom:10px">Historial</h3><ul class="historial">${oc.eventos.map(e => `<li>${esc(textoEvento(e))}<small>${fechaHora(e.creado_en)}${e.usuario ? ' · ' + esc(e.usuario) : ''}</small></li>`).join('')}</ul></div>
    </div>
    <div class="panel-pie">
      ${oc.estado === 'borrador' ? `<button class="btn primario" id="d-enviar">Enviar orden</button><button class="btn" id="d-editar">Editar</button>` : ''}
      ${abierta ? `<button class="btn primario" id="d-buscar">Buscar recepción en Wansoft</button><button class="btn" id="d-recibir">Registrar recepción manual</button>` : ''}
      ${oc.estado === 'recibida_parcial' && esCompras() ? `<button class="btn" id="d-cerrar">Cerrar con faltantes</button>` : ''}
      <button class="btn" id="d-imprimir">Imprimir</button>
      ${!['recibida', 'cancelada'].includes(oc.estado) && (oc.estado === 'borrador' || esCompras()) ? `<button class="btn peligro" id="d-cancelar" style="margin-left:auto">Cancelar orden</button>` : ''}
    </div>`);

  const recargar = () => { detalleOrden(id); if (S.vista === 'ordenes') cargarOrdenes(); };
  $('#d-enviar', panel)?.addEventListener('click', e => accion(e.currentTarget, async () => { await api(`/ordenes/${id}/enviar`, { method: 'POST' }); toast(`${oc.folio} enviada`); recargar(); }));
  $('#d-editar', panel)?.addEventListener('click', () => editorOrden(oc));
  $('#d-cancelar', panel)?.addEventListener('click', e => {
    const motivo = prompt(`¿Por qué se cancela ${oc.folio}?`);
    if (motivo === null) return;
    accion(e.currentTarget, async () => { await api(`/ordenes/${id}/cancelar`, { method: 'POST', body: { motivo } }); toast(`${oc.folio} cancelada`); recargar(); });
  });
  $('#d-cerrar', panel)?.addEventListener('click', e => {
    const motivo = prompt('¿Por qué se cierra con faltantes?', 'El proveedor no surtirá el resto');
    if (motivo === null) return;
    accion(e.currentTarget, async () => { await api(`/ordenes/${id}/cerrar`, { method: 'POST', body: { motivo } }); toast(`${oc.folio} cerrada`); recargar(); });
  });
  $('#d-recibir', panel)?.addEventListener('click', e => {
    const items = $$('[data-rec]', panel).filter(i => Number(i.value) > 0).map(i => ({ linea_id: +i.dataset.rec, cantidad: Number(i.value) }));
    if (!items.length) { $('[data-rec]', panel)?.focus(); return toast('Captura en "Recibir ahora" lo que llegó', 'error'); }
    accion(e.currentTarget, async () => {
      const r = await api(`/ordenes/${id}/recepcion`, { method: 'POST', body: { items } });
      toast(r.estado === 'recibida' ? `${oc.folio} recibida completa` : 'Recepción registrada'); recargar();
    });
  });
  $('#d-buscar', panel)?.addEventListener('click', e => accion(e.currentTarget, async () => {
    const r = await api(`/ordenes/${id}/wansoft`);
    const cont = $('#wan-sug', panel);
    if (!r.sugerencias.length) {
      cont.innerHTML = `<div class="aviso ${r.errores?.length ? 'error' : 'alerta'}">${r.errores?.length ? 'No se pudo revisar Wansoft: ' + esc(r.errores[0]) :
        `No hay entradas de compra nuevas en Wansoft para estos productos en los últimos ${r.dias} día${r.dias === 1 ? '' : 's'}.`}</div>`;
      return;
    }
    cont.innerHTML = `<div class="caja"><div style="padding:12px 14px"><h3>Entradas encontradas en Wansoft</h3><span class="muted">Revisa que correspondan a esta orden antes de aplicarlas.</span></div>
      <table><thead><tr><th></th><th>Producto</th><th class="num">Cantidad</th><th>Fecha</th><th>Proveedor en Wansoft</th></tr></thead>
      <tbody>${r.sugerencias.map((s, i) => `<tr><td><input type="checkbox" checked data-sug="${i}" aria-label="Aplicar ${esc(s.nombre)}"></td>
        <td>${esc(s.nombre || s.codigo)}</td><td class="num">${fmt(s.cantidad)}</td><td>${esc(String(s.fecha).slice(0, 10))}</td><td>${esc(s.proveedor || '—')}</td></tr>`).join('')}</tbody></table>
      <div style="padding:12px 14px"><button class="btn primario" id="sug-aplicar">Aplicar recepción</button></div></div>`;
    $('#sug-aplicar', cont).onclick = ev => accion(ev.currentTarget, async () => {
      const items = $$('[data-sug]', cont).filter(c => c.checked).map(c => r.sugerencias[c.dataset.sug]);
      if (!items.length) throw new Error('Marca al menos una entrada');
      const out = await api(`/ordenes/${id}/wansoft/aplicar`, { method: 'POST', body: { items } });
      toast(out.estado === 'recibida' ? `${oc.folio} recibida completa` : `${out.aplicadas} recepción${out.aplicadas === 1 ? '' : 'es'} aplicada${out.aplicadas === 1 ? '' : 's'}`);
      recargar();
    });
  }));
  $('#d-imprimir', panel).addEventListener('click', () => imprimirOrden(oc));
}

function textoEvento(e) {
  const t = { creada: 'Orden creada', editada: 'Orden editada', enviada: 'Orden enviada', cancelada: 'Orden cancelada', cerrada: 'Cerrada con faltantes', recepcion: 'Recibido', estado: '' }[e.tipo] ?? e.tipo;
  return [t, e.detalle].filter(Boolean).join(': ');
}

function imprimirOrden(oc) {
  const prov = S.proveedores.find(p => p.id === oc.proveedor_id);
  $('#impresion').innerHTML = `<h2>Orden de compra ${esc(oc.folio)}</h2>
    <p><b>Mozzarella Express</b> · Sucursal: ${esc(oc.sucursal)}<br>Proveedor: ${esc(oc.proveedor || '—')}${prov?.telefono ? ' · Tel. ' + esc(prov.telefono) : ''}<br>
    Fecha: ${fecha(oc.enviada_en || oc.creado_en)} · Entrega esperada: ${fecha(oc.fecha_entrega)}</p>
    ${oc.notas ? `<p>Notas: ${esc(oc.notas)}</p>` : ''}
    <table style="width:100%;border-collapse:collapse"><thead><tr><th>Código</th><th>Producto</th><th>Unidad</th><th>Cantidad</th><th>Costo</th><th>Importe</th></tr></thead>
    <tbody>${oc.lineas.map(l => `<tr><td>${esc(l.codigo)}</td><td>${esc(l.nombre || '')}</td><td>${esc(l.unidad || '')}</td><td style="text-align:right">${fmt(l.cantidad)}</td><td style="text-align:right">${dinero(l.costo_unitario)}</td><td style="text-align:right">${dinero(l.cantidad * l.costo_unitario)}</td></tr>`).join('')}
    <tr><td colspan="5" style="text-align:right"><b>Total</b></td><td style="text-align:right"><b>${dinero(oc.total)}</b></td></tr></tbody></table>
    <p style="margin-top:40px">Recibió: ______________________ &nbsp;&nbsp; Fecha: ____________</p>`;
  window.print();
}

    (S.proveedores.length ? `<div class="caja tabla-scroll"><table><thead><tr><th>Proveedor</th><th>Contacto</th><th>Teléfono</th><th>Correo</th><th>Estado</th>${esCompras() ? '<th></th>' : ''}</tr></thead>

function formProveedor(p = {}) {
  const panel = abrirPanel(`<div class="panel-cab"><h2>${p.id ? 'Editar proveedor' : 'Agregar proveedor'}</h2>${botonCerrar}</div>
    <div class="panel-cuerpo">
      <label class="campo">Nombre<input type="text" id="pv-n" value="${esc(p.nombre || '')}"></label>
      <label class="campo">Contacto<input type="text" id="pv-c" value="${esc(p.contacto || '')}"></label>
      <label class="campo">Teléfono<input type="text" id="pv-t" value="${esc(p.telefono || '')}"></label>
      <label class="campo">Correo<input type="text" id="pv-e" value="${esc(p.email || '')}"></label>
      ${p.id ? `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pv-a" ${p.activo ? 'checked' : ''}> Activo</label>` : ''}
    </div>
    <div class="panel-pie"><button class="btn primario" id="pv-g">Guardar proveedor</button><button class="btn" onclick="cerrarPanel()">Cancelar</button></div>`, { angosto: true });

// ── Grupos de sucursales ───────────────────────────────────────
function htmlGrupos() {
  const cuenta = g => S.sucursales.filter(s => (s.grupo || SIN_GRUPO) === g).length;
  const sin = cuenta(SIN_GRUPO);
  return `<div class="caja" style="padding:14px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <b>Grupos</b>
    <div class="chips">${(S.grupos || []).map(g => `<span class="chip" style="cursor:default">${esc(g)} <span class="muted">${cuenta(g)}</span></span>`).join('')}
      ${sin ? `<span class="chip" style="cursor:default;border-style:dashed">${SIN_GRUPO} <span class="muted">${sin}</span></span>` : ''}</div>
    <span class="muted" style="font-size:13px">Separan las vistas del inventario. Asigna cada sucursal en la columna Grupo.</span>
    <button class="btn mini" id="b-grupos" style="margin-left:auto">Editar grupos</button></div>`;
}
function selectGrupo(s) {
  const gs = S.grupos || [];
  return `<select data-grupo="${s.id}" aria-label="Grupo de ${esc(s.nombre)}" style="padding:4px 8px;font-size:13.5px">
    <option value="">${SIN_GRUPO}</option>${gs.map(g => `<option ${s.grupo === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>`;
}
function conectarGrupos(recargar) {
  $('#b-grupos')?.addEventListener('click', () => editorGrupos(recargar));
  $$('[data-grupo]').forEach(sel => sel.onchange = async () => {
    try {
      await api(`/sucursales/${sel.dataset.grupo}`, { method: 'PUT', body: { grupo: sel.value || null } });
      const s = S.sucursales.find(x => x.id === +sel.dataset.grupo); if (s) s.grupo = sel.value || null;
      toast(`${s?.nombre || 'Sucursal'}: ${sel.value || SIN_GRUPO}`);
      recargar();
    } catch (e) { toast(e.message, 'error'); }
  });
}
function editorGrupos(recargar) {
  const filas = (S.grupos || []).map(g => ({ nombre: g, anterior: g }));
  const panel = abrirPanel(`<div class="panel-cab"><div><h2>Grupos de sucursales</h2><div class="muted">El orden de esta lista es el orden de las columnas en el inventario.</div></div>${botonCerrar}</div>
    <div class="panel-cuerpo"><div id="gr-lista" style="display:flex;flex-direction:column;gap:8px"></div>
      <div><button class="btn" id="gr-add">Agregar grupo</button></div>
      <div class="aviso">Si borras un grupo, sus sucursales quedan como "${SIN_GRUPO}".</div></div>
    <div class="panel-pie"><button class="btn primario" id="gr-g">Guardar grupos</button><button class="btn" onclick="cerrarPanel()">Cancelar</button></div>`, { angosto: true });
  const pintar = () => {
    $('#gr-lista', panel).innerHTML = filas.map((f, i) => `<div style="display:flex;gap:6px;align-items:center">
      <input type="text" data-i="${i}" value="${esc(f.nombre)}" placeholder="Nombre del grupo" style="flex:1" aria-label="Nombre del grupo ${i + 1}">
      <button class="btn mini" data-up="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
      <button class="btn mini" data-down="${i}" ${i === filas.length - 1 ? 'disabled' : ''} aria-label="Bajar">↓</button>
      <button class="btn mini peligro" data-del="${i}">Quitar</button></div>`).join('') || '<div class="muted">Sin grupos: todas las sucursales se ven juntas.</div>';
    $$('input[data-i]', panel).forEach(inp => inp.oninput = () => { filas[inp.dataset.i].nombre = inp.value; });
    $$('[data-up]', panel).forEach(b => b.onclick = () => { const i = +b.dataset.up; [filas[i - 1], filas[i]] = [filas[i], filas[i - 1]]; pintar(); });
    $$('[data-down]', panel).forEach(b => b.onclick = () => { const i = +b.dataset.down; [filas[i + 1], filas[i]] = [filas[i], filas[i + 1]]; pintar(); });
    $$('[data-del]', panel).forEach(b => b.onclick = () => { filas.splice(+b.dataset.del, 1); pintar(); });
  };
  pintar();
  $('#gr-add', panel).onclick = () => { filas.push({ nombre: '', anterior: null }); pintar(); $(`input[data-i="${filas.length - 1}"]`, panel).focus(); };
  $('#gr-g', panel).onclick = e => accion(e.currentTarget, async () => {
    const limpias = filas.map(f => ({ ...f, nombre: f.nombre.trim() })).filter(f => f.nombre);
    const nombres = limpias.map(f => f.nombre.toLowerCase());
    if (new Set(nombres).size !== nombres.length) throw new Error('Hay dos grupos con el mismo nombre');
    if (nombres.includes(SIN_GRUPO.toLowerCase())) throw new Error(`"${SIN_GRUPO}" es un nombre reservado`);
    await api('/grupos', { method: 'PUT', body: { grupos: limpias } });
    cerrarPanel(); toast('Grupos guardados'); await cargarCatalogos(); recargar();
  });
}

async function vSucursales() {
  await cargarCatalogos();
  const conectadas = S.sucursales.filter(s => s.wansoft_id && s.tiene_password).length;
  $('#vista').innerHTML = cabeza('Sucursales y Wansoft',
    `${conectadas} de ${S.sucursales.length} sucursales conectadas. Cada sucursal usa su propio ID y contraseña del WebService de Wansoft; la contraseña se guarda cifrada y nunca se vuelve a mostrar.`,
    `<button class="btn" id="b-suc-nueva">Agregar sucursal</button><button class="btn primario" id="b-suc-sync">Actualizar todas</button>`) +
    htmlGrupos() + `<div class="caja tabla-scroll"><table><thead><tr><th>Sucursal</th><th>Grupo</th><th>ID Wansoft</th><th>Contraseña</th><th>Última actualización</th><th class="num">Productos</th><th></th></tr></thead>
    <tbody>${S.sucursales.map(s => `<tr>
      <td><b>${esc(s.nombre)}</b>${s.activa ? '' : ' <span class="est cancelado">Inactiva</span>'}</td><td>${selectGrupo(s)}</td>
      <td>${s.wansoft_id ? esc(s.wansoft_id) : '<span class="muted">Falta</span>'}</td>
      <td>${s.tiene_password ? '<span class="est ok">Guardada</span>' : '<span class="muted">Falta</span>'}</td>
      <td>${s.ultimo_error ? `<span class="est error" title="${esc(s.ultimo_error)}">Error</span><br><span class="muted" style="font-size:13px">${esc(s.ultimo_error.slice(0, 90))}</span>` : esc(hace(s.ultimo_sync))}</td>
      <td class="num">${fmt(s.productos)}</td>
      <td style="white-space:nowrap"><button class="btn mini" data-ed="${s.id}">Editar</button>
        ${s.wansoft_id && s.tiene_password ? `<button class="btn mini" data-sy="${s.id}">Actualizar</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
  $('#b-suc-sync').onclick = e => accion(e.currentTarget, async () => {
    const r = await api('/sucursales/sync', { method: 'POST' });
    const mal = r.resultados.filter(x => !x.ok).length;
    toast(r.resultados.length ? `Listo: ${r.resultados.length - mal} correctas${mal ? `, ${mal} con error` : ''}` : 'No hay sucursales con claves todavía', mal ? 'error' : null);
    vSucursales();
  });
  $('#b-suc-nueva').onclick = () => formSucursal();
  $$('[data-ed]').forEach(b => b.onclick = () => formSucursal(S.sucursales.find(s => s.id === +b.dataset.ed)));
  conectarGrupos(vSucursales);
  $$('[data-sy]').forEach(b => b.onclick = () => accion(b, async () => {
    const r = await api(`/sucursales/${b.dataset.sy}/sync`, { method: 'POST' });
    toast(r.ok ? `${r.sucursal}: ${r.productos} con existencia, ${r.catalogo} en catálogo` : `${r.sucursal}: ${r.error}`, r.ok ? null : 'error');
    vSucursales();
  }));
}
function formSucursal(s = {}) {
  const panel = abrirPanel(`<div class="panel-cab"><h2>${s.id ? esc(s.nombre) : 'Agregar sucursal'}</h2>${botonCerrar}</div>
    <div class="panel-cuerpo">
      <label class="campo">Nombre<input type="text" id="su-n" value="${esc(s.nombre || '')}"></label>
      ${s.id ? `
      <label class="campo">ID de sucursal en Wansoft (subsidiaryId)<input type="number" id="su-i" value="${esc(s.wansoft_id || '')}"></label>
      <label class="campo">Contraseña del WebService (pwdWebService)<input type="password" id="su-p" autocomplete="new-password" placeholder="${s.tiene_password ? 'Guardada. Escribe una nueva solo si cambió' : 'Escribe la contraseña'}"></label>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="su-a" ${s.activa ? 'checked' : ''}> Sucursal activa (aparece en inventario y órdenes)</label>
      <div class="aviso">Wansoft entrega estas claves por sucursal. Después de guardar, usa "Probar conexión" para confirmar que funcionan.</div>` : ''}
    </div>
    <div class="panel-pie"><button class="btn primario" id="su-g">Guardar</button>${s.id ? `<button class="btn" id="su-t">Guardar y probar conexión</button>` : ''}<button class="btn" onclick="cerrarPanel()">Cancelar</button></div>`, { angosto: true });
  const guardar = async () => {
    const nombre = $('#su-n', panel).value.trim();
    if (!nombre) throw new Error('Escribe el nombre');
    if (!s.id) { await api('/sucursales', { method: 'POST', body: { nombre } }); return; }
    const body = { nombre, wansoft_id: $('#su-i', panel).value, activa: $('#su-a', panel).checked };
    const pwd = $('#su-p', panel).value; if (pwd) body.password = pwd;
    await api(`/sucursales/${s.id}`, { method: 'PUT', body });
  };
  $('#su-g', panel).onclick = e => accion(e.currentTarget, async () => { await guardar(); cerrarPanel(); toast('Sucursal guardada'); vSucursales(); });
  $('#su-t', panel)?.addEventListener('click', e => accion(e.currentTarget, async () => {
    await guardar();
    const r = await api(`/sucursales/${s.id}/sync`, { method: 'POST' });
    if (r.ok) { cerrarPanel(); toast(`Conexión correcta: ${r.productos} productos`); vSucursales(); }
    else throw new Error(r.error);
  }));
}

  $('#vista').innerHTML = cabeza('Usuarios', 'Administrador configura todo. Compras maneja órdenes y ajustes de todas las sucursales. Supervisor revisa y aprueba los conteos de sus sucursales. Gerente ve el inventario y hace pedidos de su sucursal. Empleado solo captura conteos desde el teléfono, sin ver lo que dice Wansoft.',
    `<button class="btn primario" id="b-us">Agregar usuario</button>`) +
    `<div class="caja tabla-scroll"><table><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Sucursales</th><th>Estado</th><th></th></tr></thead>
    <tbody>${us.map(u => `<tr><td><b>${esc(u.nombre)}</b></td><td>${esc(u.usuario)}</td><td>${ROLES[u.rol]}</td>
      <td>${ROLES_ACOTADOS.includes(u.rol) ? (u.sucursales.length ? esc(u.sucursales.map(nombreSuc).join(', ')) : '<span class="dif-neg">Sin asignar</span>') : '<span class="muted">Todas</span>'}</td>

}
function formUsuario(u = { rol: 'sucursal', sucursales: [], activo: true }) {
  const panel = abrirPanel(`<div class="panel-cab"><h2>${u.id ? esc(u.nombre) : 'Agregar usuario'}</h2>${botonCerrar}</div>
    <div class="panel-cuerpo">
      <label class="campo">Nombre<input type="text" id="us-n" value="${esc(u.nombre || '')}"></label>
      ${u.id ? '' : `<label class="campo">Usuario para entrar<input type="text" id="us-u" autocomplete="off"></label>`}
      <label class="campo">${u.id ? 'Nueva contraseña (déjala vacía para no cambiarla)' : 'Contraseña'}<input type="password" id="us-p" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></label>
      <label class="campo">Rol<select id="us-r">${Object.entries(ROLES).map(([k, t]) => `<option value="${k}" ${u.rol === k ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <fieldset id="us-sucs" style="border:1px solid var(--linea);border-radius:var(--r-s);padding:10px 12px;max-height:260px;overflow:auto">
        <legend style="font-size:13px;color:var(--tinta-2);font-weight:500">Sucursales que puede ver</legend>
        <label style="display:flex;gap:8px;padding:2px 0 6px;border-bottom:1px solid var(--linea-2);margin-bottom:4px"><input type="checkbox" id="us-todas"><b>Seleccionar todas</b></label>
        ${S.sucursales.map(s => `<label style="display:flex;gap:8px;padding:2px 0"><input type="checkbox" data-suc value="${s.id}" ${u.sucursales.includes(s.id) ? 'checked' : ''}>${esc(s.nombre)}</label>`).join('')}
      </fieldset>
      ${u.id ? `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="us-a" ${u.activo ? 'checked' : ''}> Puede entrar</label>` : ''}
    </div>
    <div class="panel-pie"><button class="btn primario" id="us-g">Guardar usuario</button><button class="btn" onclick="cerrarPanel()">Cancelar</button></div>`, { angosto: true });
  const rol = $('#us-r', panel), fs = $('#us-sucs', panel);
  const toggle = () => fs.classList.toggle('oculto', !ROLES_ACOTADOS.includes(rol.value));
  rol.onchange = toggle; toggle();
  $('#us-todas', panel).onchange = e => $$('input[data-suc]', fs).forEach(i => i.checked = e.target.checked);
  $('#us-g', panel).onclick = e => accion(e.currentTarget, async () => {
    const body = { nombre: $('#us-n', panel).value, rol: rol.value, sucursales: $$('input[data-suc]:checked', fs).map(i => +i.value) };
    const p = $('#us-p', panel).value; if (p) body.password = p;
    if (ROLES_ACOTADOS.includes(rol.value) && !body.sucursales.length) throw new Error('Asigna al menos una sucursal');
    if (u.id) await api(`/usuarios/${u.id}`, { method: 'PUT', body: { ...body, activo: $('#us-a', panel).checked } });
    else await api('/usuarios', { method: 'POST', body: { ...body, usuario: $('#us-u', panel).value } });
    cerrarPanel(); toast('Usuario guardado'); vUsuarios();
  });
}
function cambiarPassword() {
  const panel = abrirPanel(`<div class="panel-cab"><h2>Cambiar contraseña</h2>${botonCerrar}</div>
    <div class="panel-cuerpo">
      <label class="campo">Contraseña actual<input type="password" id="cp-a" autocomplete="current-password"></label>
      <label class="campo">Nueva contraseña<input type="password" id="cp-n" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></label>

}

    <tbody>${rows.map(r => `<tr><td style="white-space:nowrap">${fechaHora(r.creado_en)}</td><td>${esc(r.usuario || 'Sistema')}</td><td>${esc(ACC[r.accion] || r.accion)}</td>

function detalleBitacora(d) {
  if (!d) return '';
  if (d.folio) return d.folio + (d.estado ? ' · ' + (ESTADO_OC[d.estado] || d.estado) : '');
  if (d.folios) return d.folios.join(', ');
  if (d.sucursal) return d.sucursal;
  if (d.nombre) return d.nombre;
  if (d.usuario) return d.usuario;
  if ('ok' in d) return `${d.ok} correctas, ${d.error} con error`;
  if (d.estado) return ESTADO_AJ[d.estado] || d.estado;
  return '';
}

const LS = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const ESTADO_CT = { enviado: 'Por revisar', devuelto: 'Recontar', aprobado: 'Aprobado', cancelado: 'Cancelado' };
const CLASE_CT = { enviado: 'enviada', devuelto: 'pendiente', aprobado: 'recibida', cancelado: 'cancelada' };
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const normTxt = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

// ── Envíos pendientes (si no hay señal se guardan en el teléfono) ──
const outboxKey = () => `mz_outbox_${S.user?.id}`;
function pendientesEnvio() { return LS.get(outboxKey(), []); }
let enviando = false;
async function enviarPendientes() {
  if (enviando || !S.user) return;
  const cola = pendientesEnvio();
  if (!cola.length) return;
  enviando = true;
  const resto = [];
  let enviados = 0;
  for (const item of cola) {
    try {
      if (item.tipo === 'recontar') await api(`/conteos/${item.id}/recontar`, { method: 'POST', body: item.body });
      else await api('/conteos', { method: 'POST', body: item.body });
      enviados++;
    } catch (e) {
      if (e instanceof TypeError || !navigator.onLine) { resto.push(item); continue; }
      // El servidor lo rechazó: se regresa como borrador para corregirlo
      LS.set(item.borrador, { valores: Object.fromEntries(item.body.lineas.map(l => [l.codigo, String(l.cantidad)])), inicio: item.body.contado_en });
      toast(`No se pudo enviar "${item.body.nombre || 'conteo'}": ${e.message}`, 'error');
    }
  }
  LS.set(outboxKey(), resto);
  enviando = false;
  if (enviados) {
    toast(enviados === 1 ? 'Conteo enviado' : `${enviados} conteos enviados`);
    if (S.vista === 'contar' && !$('.contando')) vContar(S.contarCont);
  }
}
window.addEventListener('online', enviarPendientes);
setInterval(enviarPendientes, 30000);

// ── Pantalla principal de conteo ───────────────────────────────────
async function vContar(cont) {
  S.contarCont = cont;
  enviarPendientes();
  let datos, mios = [];
  try {
    [datos, mios] = await Promise.all([api('/conteos/hoy'), api('/conteos').catch(() => [])]);
    LS.set(`mz_hoy_${S.user.id}`, datos);
  } catch (e) {
    datos = LS.get(`mz_hoy_${S.user.id}`);
    if (!datos) { cont.innerHTML = `<div class="aviso error">${esc(e.message)}</div>`; return; }
  }
  const sucs = datos.sucursales;
  if (!sucs.length) { cont.innerHTML = `<div class="caja vacio"><b>No tienes sucursal asignada</b>Pide a tu supervisor que te asigne una.</div>`; return; }
  let suc = LS.get(`mz_suc_${S.user.id}`);
  if (!sucs.some(s => s.id === suc)) suc = sucs[0].id;
  const sucNombre = sucs.find(s => s.id === suc).nombre;
  const tareas = datos.tareas.filter(t => t.sucursal_id === suc);
  if (S.user.rol !== 'empleado') mios = mios.filter(c => c.creado_por_nombre === S.user.nombre);
  const devueltos = mios.filter(c => c.estado === 'devuelto');
  const cola = pendientesEnvio();
  const borradores = Object.keys(localStorage).filter(k => k.startsWith(`mz_borrador_${S.user.id}_${suc}_`));
  const enMovil = S.user.rol === 'empleado';

  cont.innerHTML = `
    ${enMovil ? '' : cabeza('Capturar conteo', 'Cuenta a ciegas, igual que lo hacen los empleados desde el teléfono. Tu supervisor revisa las diferencias.')}
    ${bannerInstalar()}
    ${cola.length ? `<div class="pendientes-envio"><span class="carga"></span> ${cola.length === 1 ? 'Un conteo guardado en este teléfono se enviará' : cola.length + ' conteos guardados en este teléfono se enviarán'} cuando haya señal.</div>` : ''}
    ${sucs.length > 1 ? `<label class="campo">Sucursal<select id="ct-suc">${sucs.map(s => `<option value="${s.id}" ${s.id === suc ? 'selected' : ''}>${esc(s.nombre)}</option>`).join('')}</select></label>`
      : `<div><span class="muted">Sucursal</span><h2>${esc(sucNombre)}</h2></div>`}
    ${devueltos.length ? `<section><h2 style="margin-bottom:8px">Para recontar</h2><div class="lista-tareas">${devueltos.map(c => `
      <button class="tarea" data-rec="${c.id}"><div><b>${esc(c.nombre || 'Conteo')} · ${esc(c.folio)}</b>
        <span class="muted">${c.por_recontar} producto${c.por_recontar === 1 ? '' : 's'} por recontar${c.comentario ? ' · ' + esc(c.comentario) : ''}</span></div>
        <span class="est pendiente">Recontar</span></button>`).join('')}</div></section>` : ''}
    <section><h2 style="margin-bottom:8px">Hoy te toca</h2><div class="lista-tareas">
      ${tareas.length ? tareas.map(t => {
        const bor = LS.get(`mz_borrador_${S.user.id}_${suc}_${t.programa_id}`);
        return `<button class="tarea ${t.hecho ? 'hecha' : ''}" data-prog="${t.programa_id}"><div><b>${esc(t.nombre)}</b>
          <span class="muted">${t.departamentos.length ? esc(t.departamentos.join(', ')) : 'Todos los productos'}</span></div>
          ${t.hecho ? '<span class="est recibida">Enviado</span>' : bor ? '<span class="est pendiente">A medias</span>' : '<span class="est enviada">Pendiente</span>'}</button>`;
      }).join('') : '<div class="muted">No hay conteos programados para hoy.</div>'}
      <button class="tarea" data-prog="libre"><div><b>Conteo libre</b><span class="muted">Elige qué productos contar</span></div>
        ${borradores.some(k => k.endsWith('_libre')) ? '<span class="est pendiente">A medias</span>' : ''}</button>
    </div></section>
    ${mios.filter(c => c.estado !== 'devuelto').length ? `<section><h2 style="margin-bottom:8px">Mis conteos recientes</h2><div class="caja">
      <table><tbody>${mios.filter(c => c.estado !== 'devuelto').slice(0, 8).map(c => `<tr><td><b>${esc(c.nombre || 'Conteo')}</b><br><span class="muted">${esc(c.folio)} · ${fechaHora(c.enviado_en)}</span></td>
        <td class="num"><span class="est ${CLASE_CT[c.estado]}">${ESTADO_CT[c.estado]}</span></td></tr>`).join('')}</tbody></table></div></section>` : ''}`;

  $('#ct-suc', cont)?.addEventListener('change', e => { LS.set(`mz_suc_${S.user.id}`, +e.target.value); vContar(cont); });
  $('#b-inst', cont)?.addEventListener('click', async () => { await promptInstalar.prompt(); promptInstalar = null; $('#banner-inst')?.remove(); });
  $('#b-no-inst', cont)?.addEventListener('click', () => { LS.set('mz_no_instalar', true); $('#banner-inst')?.remove(); });
  $$('[data-prog]', cont).forEach(b => b.onclick = () => {
    const t = tareas.find(x => String(x.programa_id) === b.dataset.prog);
    if (t?.hecho && !confirm('Este conteo ya se envió hoy. ¿Quieres hacerlo de nuevo?')) return;
    iniciarConteo({ sucursal_id: suc, sucursal: sucNombre, programa_id: t?.programa_id || null, nombre: t?.nombre || 'Conteo libre', departamentos: t?.departamentos || [] });
  });
  $$('[data-rec]', cont).forEach(b => b.onclick = async () => {
    try {
      const c = await api('/conteos/' + b.dataset.rec);
      iniciarConteo({ sucursal_id: c.sucursal_id, sucursal: c.sucursal, nombre: `Recontar ${c.folio}`, recontar: c });
    } catch (e) { toast(e.message, 'error'); }
  });
}

// ── Sesión de conteo a pantalla completa ───────────────────────────
async function iniciarConteo(cfg) {
  const claveBorrador = `mz_borrador_${S.user.id}_${cfg.sucursal_id}_${cfg.recontar ? 'rec' + cfg.recontar.id : (cfg.programa_id || 'libre')}`;
  let productos;
  if (cfg.recontar) {
    productos = cfg.recontar.lineas.filter(l => l.recontar).map(l => ({ codigo: l.codigo, nombre: l.nombre, unidad: l.unidad, departamento: l.departamento || 'Sin departamento' }));
  } else {
    try {
      productos = await api(`/conteos/productos/${cfg.sucursal_id}`);
      LS.set(`mz_prod_${cfg.sucursal_id}`, productos);
    } catch (e) {
      productos = LS.get(`mz_prod_${cfg.sucursal_id}`);
      if (!productos) return toast('Sin señal y sin lista de productos guardada. Intenta con señal.', 'error');
    }
    if (cfg.departamentos?.length) productos = productos.filter(p => cfg.departamentos.includes(p.departamento));
  }
  if (!productos.length) return toast('No hay productos para contar en esta sucursal', 'error');

  const borrador = LS.get(claveBorrador) || {};
  const valores = new Map(Object.entries(borrador.valores || {}));
  const inicio = borrador.inicio || new Date().toISOString();
  const deps = [...new Set(productos.map(p => p.departamento))];
  const vista = { dep: '', q: '' };

  const ov = document.createElement('div');
  ov.className = 'contando';
  ov.setAttribute('role', 'dialog');
  ov.setAttribute('aria-label', cfg.nombre);
  ov.innerHTML = `
    <div class="contando-cab"><div class="fila">
      <div><h2>${esc(cfg.nombre)}</h2><span class="muted" id="ct-av-txt"></span></div>
      <button class="btn mini" id="ct-salir" style="margin-left:auto">Guardar y salir</button></div>
      <div class="avance" aria-hidden="true"><i id="ct-av"></i></div></div>
    ${deps.length > 1 ? `<div class="contando-filtros" role="group" aria-label="Departamento">
      <button class="chip" data-dep="" aria-pressed="true">Todos</button>
      <button class="chip" data-dep="__faltan" aria-pressed="false">Sin contar</button>
      ${deps.map(d => `<button class="chip" data-dep="${esc(d)}" aria-pressed="false">${esc(d)}</button>`).join('')}</div>` : ''}
    ${productos.length > 8 ? `<div class="contando-buscar"><input type="search" id="ct-q" placeholder="Buscar producto" aria-label="Buscar producto"></div>` : ''}
    <div class="contando-lista" id="ct-lista"></div>
    <div class="contando-pie"><span class="muted" id="ct-pie-txt"></span><button class="btn primario" id="ct-enviar">Enviar conteo</button></div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';

  let tGuardar;
  const guardarBorrador = () => {
    clearTimeout(tGuardar);
    tGuardar = setTimeout(() => {
      const v = Object.fromEntries([...valores].filter(([, x]) => x !== ''));
      if (Object.keys(v).length) LS.set(claveBorrador, { valores: v, inicio }); else LS.del(claveBorrador);
    }, 300);
  };
  const contados = () => productos.filter(p => (valores.get(p.codigo) ?? '') !== '').length;
  const avance = () => {
    const n = contados();
    $('#ct-av', ov).style.width = `${Math.round(100 * n / productos.length)}%`;
    $('#ct-av-txt', ov).textContent = `${cfg.sucursal} · ${n} de ${productos.length} contados`;
    $('#ct-pie-txt', ov).textContent = n < productos.length ? `Faltan ${productos.length - n}` : 'Todo contado';
  };
  const pintar = () => {
    const q = normTxt(vista.q);
    const lista = productos.filter(p =>
      (!vista.dep || (vista.dep === '__faltan' ? (valores.get(p.codigo) ?? '') === '' : p.departamento === vista.dep)) &&
      (!q || normTxt(p.nombre).includes(q) || normTxt(p.codigo).includes(q)));
    let dep = null, html = '';
    for (const p of lista) {
      if (p.departamento !== dep && deps.length > 1) { dep = p.departamento; html += `<div class="dep-titulo">${esc(dep)}</div>`; }
      const v = valores.get(p.codigo) ?? '';
      html += `<label class="prod ${cfg.recontar ? 'recontar' : ''} ${v !== '' ? 'contado' : ''}">
        <span class="info"><b>${esc(p.nombre || p.codigo)}</b><span>${esc(p.unidad || '')} · ${esc(p.codigo)}</span></span>
        <input type="number" inputmode="decimal" min="0" step="any" enterkeyhint="next" data-c="${esc(p.codigo)}" value="${esc(v)}" placeholder="—" aria-label="Cantidad de ${esc(p.nombre)} en ${esc(p.unidad || 'unidades')}"></label>`;
    }
    $('#ct-lista', ov).innerHTML = html || `<div class="vacio">${vista.dep === '__faltan' ? 'Ya contaste todo.' : 'Ningún producto coincide.'}</div>`;
    const inputs = $$('input[data-c]', ov);
    inputs.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        valores.set(inp.dataset.c, inp.value.trim());
        inp.closest('.prod').classList.toggle('contado', inp.value.trim() !== '');
        avance(); guardarBorrador();
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); const sig = inputs[i + 1]; if (sig) { sig.focus(); sig.select(); } else inp.blur(); }
      });
    });
    avance();
  };
  const cerrar = () => { clearTimeout(tGuardar); ov.remove(); document.body.style.overflow = ''; };

  $$('[data-dep]', ov).forEach(b => b.onclick = () => { vista.dep = b.dataset.dep; $$('[data-dep]', ov).forEach(x => x.setAttribute('aria-pressed', x === b)); pintar(); $('#ct-lista', ov).scrollTop = 0; });
  let tq; $('#ct-q', ov)?.addEventListener('input', e => { clearTimeout(tq); tq = setTimeout(() => { vista.q = e.target.value; pintar(); }, 150); });
  $('#ct-salir', ov).onclick = () => {
    const v = Object.fromEntries([...valores].filter(([, x]) => x !== ''));
    if (Object.keys(v).length) LS.set(claveBorrador, { valores: v, inicio }); else LS.del(claveBorrador);
    cerrar(); if (Object.keys(v).length) toast('Guardado. Puedes continuar después.'); vContar(S.contarCont);
  };
  $('#ct-enviar', ov).onclick = () => {
    const lineas = productos.filter(p => (valores.get(p.codigo) ?? '') !== '').map(p => ({ codigo: p.codigo, cantidad: Number(valores.get(p.codigo)) }));
    if (lineas.some(l => !Number.isFinite(l.cantidad) || l.cantidad < 0)) return toast('Revisa las cantidades: solo números mayores o iguales a cero', 'error');
    if (!lineas.length) return toast('Captura al menos un producto', 'error');
    const faltan = productos.length - lineas.length;
    if (cfg.recontar && faltan) return toast(`Te falta recontar ${faltan} producto${faltan === 1 ? '' : 's'}`, 'error');
    if (faltan && !confirm(`Contaste ${lineas.length} de ${productos.length}. Los ${faltan} que no contaste no se revisarán. ¿Enviar así?`)) return;
    const item = cfg.recontar
      ? { tipo: 'recontar', id: cfg.recontar.id, body: { lineas }, borrador: claveBorrador }
      : { tipo: 'conteo', borrador: claveBorrador, body: { sucursal_id: cfg.sucursal_id, programa_id: cfg.programa_id, nombre: cfg.nombre, cliente_id: uuid(), contado_en: inicio, lineas } };
    LS.set(outboxKey(), [...pendientesEnvio(), item]);
    LS.del(claveBorrador);
    cerrar();
    if (!navigator.onLine) toast('Sin señal: el conteo quedó guardado y se enviará solo');
    enviarPendientes().then(() => vContar(S.contarCont));
  };
  pintar();
  setTimeout(() => $('input[data-c]', ov)?.focus(), 50);
}

// ── Revisión de conteos (supervisor) ───────────────────────────────
const fCT = { estado: 'enviado' };
async function vConteos() {
  $('#vista').innerHTML = cabeza('Conteos', 'Conteos que capturan los empleados desde el teléfono, sin ver lo que dice Wansoft. Revisa las diferencias, devuelve lo que haya que recontar y aprueba para generar los ajustes.',
    `${esRevisor() ? '<button class="btn" id="b-progs">Conteos programados</button>' : ''}`) +
    `<div class="filtros"><div class="chips" role="group" aria-label="Estado">${[['enviado', 'Por revisar'], ['devuelto', 'En recuento'], ['aprobado', 'Aprobados'], ['', 'Todos']].map(([k, t]) =>
      `<button class="chip" data-e="${k}" aria-pressed="${fCT.estado === k}">${t}</button>`).join('')}</div></div>
    <div id="ct-cont"><div class="vacio"><span class="carga"></span></div></div>`;
  $$('[data-e]').forEach(b => b.onclick = () => { fCT.estado = b.dataset.e; vConteos(); });
  $('#b-progs')?.addEventListener('click', vProgramas);
  try {
    const rows = await api('/conteos' + (fCT.estado ? '?estado=' + fCT.estado : ''));
    actualizarCuentaConteos();
    if (!rows.length) {
      $('#ct-cont').innerHTML = `<div class="caja vacio"><b>${fCT.estado === 'enviado' ? 'No hay conteos por revisar' : 'Sin conteos'}</b>Los empleados capturan conteos desde el teléfono con un usuario de tipo Empleado.${esAdmin() ? ' Créalos en Usuarios.' : ''}</div>`;
      return;
    }
    $('#ct-cont').innerHTML = `<div class="caja tabla-scroll"><table><thead><tr><th>Folio</th><th>Sucursal</th><th>Conteo</th><th>Contó</th><th>Enviado</th><th class="num">Productos</th><th class="num">Con diferencia</th><th class="num">Impacto a costo</th><th>Estado</th></tr></thead>
      <tbody>${rows.map(c => `<tr class="clic" data-ct="${c.id}" tabindex="0"><td><b>${esc(c.folio)}</b></td><td>${esc(c.sucursal)}</td><td>${esc(c.nombre || '')}</td>
        <td>${esc(c.creado_por_nombre || '')}</td><td>${fechaHora(c.enviado_en)}</td><td class="num">${c.productos}</td>
        <td class="num">${c.con_diferencia || '—'}</td><td class="num ${c.impacto < 0 ? 'dif-neg' : ''}">${c.con_diferencia ? dinero(c.impacto) : '—'}</td>
        <td><span class="est ${CLASE_CT[c.estado]}">${ESTADO_CT[c.estado]}</span></td></tr>`).join('')}</tbody></table></div>`;
    $$('[data-ct]').forEach(tr => { tr.onclick = () => detalleConteo(tr.dataset.ct); tr.onkeydown = e => { if (e.key === 'Enter') detalleConteo(tr.dataset.ct); }; });
  } catch (e) { $('#ct-cont').innerHTML = `<div class="aviso error">${esc(e.message)}</div>`; }
}

async function detalleConteo(id) {
  let c;
  try { c = await api('/conteos/' + id); } catch (e) { return toast(e.message, 'error'); }
  const revisable = c.estado === 'enviado' && esRevisor();
  const ls = c.lineas.map(l => {
    const sis = Number(l.existencia_sistema || 0), dif = Number(l.cantidad) - sis;
    return { ...l, sis, dif, imp: dif * Number(l.costo || 0) };
  }).sort((a, b) => Math.abs(b.imp) - Math.abs(a.imp) || Math.abs(b.dif) - Math.abs(a.dif));
  const conDif = ls.filter(l => Math.abs(l.dif) > 0.0001);
  const impacto = conDif.reduce((a, l) => a + l.imp, 0);
  let soloDif = conDif.length > 0;

  const panel = abrirPanel(`
    <div class="panel-cab"><div><h2>${esc(c.folio)} <span class="est ${CLASE_CT[c.estado]}" style="vertical-align:3px">${ESTADO_CT[c.estado]}</span></h2>
      <div class="muted">${esc(c.sucursal)} · ${esc(c.nombre || 'Conteo')}</div></div>${botonCerrar}</div>
    <div class="panel-cuerpo">
      <div class="resumen" style="margin:0">
        <div><b>${ls.length}</b><span>Productos contados</span></div>
        <div><b>${conDif.length}</b><span>Con diferencia</span></div>
        <div><b class="${impacto < 0 ? 'dif-neg' : ''}">${dinero(impacto)}</b><span>Impacto a costo</span></div>
      </div>
      <div class="rejilla">
        <div><span class="muted">Contó</span><br>${esc(c.creado_por_nombre || '—')}</div>
        <div><span class="muted">Enviado</span><br>${fechaHora(c.enviado_en)}</div>
        <div><span class="muted">Comparado contra Wansoft de</span><br>${fechaHora(c.sistema_en)}</div>
        ${c.revisado_por_nombre ? `<div><span class="muted">Revisó</span><br>${esc(c.revisado_por_nombre)}, ${fechaHora(c.revisado_en)}</div>` : ''}
      </div>
      ${c.comentario ? `<div class="aviso">${esc(c.comentario)}</div>` : ''}
      ${revisable ? `<div class="aviso alerta">Revisa las diferencias grandes. Si algo no cuadra, márcalo y devuélvelo para que lo vuelvan a contar. Al aprobar, cada diferencia se convierte en un ajuste pendiente de capturar en Wansoft.</div>` : ''}
      <div class="chips" role="group" aria-label="Mostrar"><button class="chip" data-v="dif" aria-pressed="${soloDif}">Con diferencia (${conDif.length})</button><button class="chip" data-v="todo" aria-pressed="${!soloDif}">Todos (${ls.length})</button></div>
      <div class="caja tabla-scroll" id="ct-lineas"></div>
      <div><h3 style="margin-bottom:10px">Historial</h3><ul class="historial">${c.eventos.map(e => `<li>${esc({ enviado: 'Enviado', recontado: 'Recontado', devuelto: 'Devuelto para recontar', aprobado: 'Aprobado', cancelado: 'Cancelado' }[e.tipo] || e.tipo)}${e.detalle ? ': ' + esc(e.detalle) : ''}<small>${fechaHora(e.creado_en)}${e.usuario ? ' · ' + esc(e.usuario) : ''}</small></li>`).join('')}</ul></div>
    </div>
    ${revisable ? `<div class="panel-pie">
      <button class="btn primario" id="ct-aprobar">${conDif.length ? `Aprobar y generar ${conDif.length} ajuste${conDif.length === 1 ? '' : 's'}` : 'Aprobar (sin diferencias)'}</button>
      <button class="btn" id="ct-devolver">Devolver para recontar</button>
      <button class="btn peligro" id="ct-cancelar" style="margin-left:auto">Cancelar conteo</button></div>` : ''}`);

  const marcados = new Set();
  const pintar = () => {
    const filas = soloDif ? conDif : ls;
    $('#ct-lineas', panel).innerHTML = filas.length ? `<table><thead><tr>${revisable ? '<th class="chk"><span class="oculto">Recontar</span></th>' : ''}<th>Producto</th><th class="num">Wansoft</th><th class="num">Contado</th><th class="num">Diferencia</th><th class="num">Impacto</th></tr></thead>
      <tbody>${filas.map(l => `<tr class="${l.recontar ? 'dif-fila' : ''}">
        ${revisable ? `<td class="chk"><input type="checkbox" data-r="${esc(l.codigo)}" ${marcados.has(l.codigo) ? 'checked' : ''} aria-label="Pedir recontar ${esc(l.nombre)}"></td>` : ''}
        <td><b>${esc(l.nombre || l.codigo)}</b><br><span class="muted">${esc(l.codigo)} · ${esc(l.unidad || '')}${l.recontar ? ' · por recontar' : ''}</span></td>
        <td class="num">${fmt(l.sis)}</td><td class="num"><b>${fmt(l.cantidad)}</b></td>
        <td class="num ${l.dif < 0 ? 'dif-neg' : l.dif > 0 ? 'dif-pos' : ''}">${Math.abs(l.dif) < 0.0001 ? '—' : (l.dif > 0 ? '+' : '') + fmt(l.dif)}</td>
        <td class="num">${Math.abs(l.dif) < 0.0001 || !l.costo ? '—' : dinero(l.imp)}</td></tr>`).join('')}</tbody></table>`
      : `<div class="vacio">Todo coincide con Wansoft.</div>`;
    $$('[data-r]', panel).forEach(cb => cb.onchange = () => { cb.checked ? marcados.add(cb.dataset.r) : marcados.delete(cb.dataset.r); });
  };
  $$('[data-v]', panel).forEach(b => b.onclick = () => { soloDif = b.dataset.v === 'dif'; $$('[data-v]', panel).forEach(x => x.setAttribute('aria-pressed', x === b)); pintar(); });
  pintar();
  const recargar = () => { detalleConteo(id); if (S.vista === 'conteos') vConteos(); };
  $('#ct-aprobar', panel)?.addEventListener('click', e => accion(e.currentTarget, async () => {
    if (marcados.size && !confirm('Marcaste productos para recontar. ¿Aprobar de todos modos sin recontarlos?')) return;
    const r = await api(`/conteos/${id}/aprobar`, { method: 'POST', body: {} });
    toast(r.ajustes.length ? `Aprobado: ${r.ajustes.length} ajuste${r.ajustes.length === 1 ? '' : 's'} pendiente${r.ajustes.length === 1 ? '' : 's'} de capturar en Wansoft` : 'Aprobado sin diferencias');
    recargar();
  }));
  $('#ct-devolver', panel)?.addEventListener('click', e => {
    if (!marcados.size) return toast('Marca en la tabla los productos que deben recontar', 'error');
    const comentario = prompt(`Se pedirá recontar ${marcados.size} producto${marcados.size === 1 ? '' : 's'}. ¿Alguna indicación para el empleado?`, '');
    if (comentario === null) return;
    accion(e.currentTarget, async () => {
      await api(`/conteos/${id}/devolver`, { method: 'POST', body: { codigos: [...marcados], comentario } });
      toast('Devuelto para recontar'); recargar();
    });
  });
  $('#ct-cancelar', panel)?.addEventListener('click', e => {
    const comentario = prompt('¿Por qué se cancela este conteo?');
    if (comentario === null) return;
    accion(e.currentTarget, async () => { await api(`/conteos/${id}/cancelar`, { method: 'POST', body: { comentario } }); toast('Conteo cancelado'); recargar(); });
  });
}

  const nombreSuc = id => S.sucursales.find(s => s.id === id)?.nombre || id;
  const panel = abrirPanel(`
    <div class="panel-cab"><div><h2>Conteos programados</h2><div class="muted">Le dicen a cada sucursal qué contar cada día. Ej.: lácteos y carnes diario, abarrotes los lunes.</div></div>${botonCerrar}</div>
    <div class="panel-cuerpo">
      ${progs.length ? `<div class="caja"><table><thead><tr><th>Conteo</th><th>Qué se cuenta</th><th>Días</th><th>Sucursales</th><th></th></tr></thead><tbody>
        ${progs.map(p => `<tr${p.activo ? '' : ' style="opacity:.55"'}><td><b>${esc(p.nombre)}</b>${p.activo ? '' : '<br><span class="muted">Pausado</span>'}</td>

          <td><button class="btn mini" data-pg="${p.id}">Editar</button></td></tr>`).join('')}</tbody></table></div>`
        : '<div class="caja vacio"><b>Sin conteos programados</b>Sin programa, los empleados solo pueden hacer conteos libres.</div>'}
    </div>
    <div class="panel-pie"><button class="btn primario" id="pg-nuevo">Programar conteo</button></div>`);
  $('#pg-nuevo', panel).onclick = () => formPrograma({}, deps);
  $$('[data-pg]', panel).forEach(b => b.onclick = () => formPrograma(progs.find(p => p.id === +b.dataset.pg), deps));
}
function formPrograma(p, deps) {
  p = { nombre: '', departamentos: [], dias: [], sucursales: [], activo: true, ...p };
  const caja = 'border:1px solid var(--linea);border-radius:var(--r-s);padding:10px 12px;max-height:200px;overflow:auto';
  const panel = abrirPanel(`
    <div class="panel-cab"><h2>${p.id ? 'Editar conteo programado' : 'Programar conteo'}</h2>${botonCerrar}</div>
    <div class="panel-cuerpo">
      <label class="campo">Nombre que verá el empleado<input type="text" id="pg-n" value="${esc(p.nombre)}" placeholder="Ej. Lácteos y carnes"></label>
      <fieldset style="${caja}"><legend style="font-size:13px;color:var(--tinta-2);font-weight:500">Departamentos a contar (ninguno marcado = todo)</legend>
        ${deps.map(d => `<label style="display:flex;gap:8px;padding:2px 0"><input type="checkbox" data-pd value="${esc(d)}" ${p.departamentos.includes(d) ? 'checked' : ''}>${esc(d)}</label>`).join('') || '<span class="muted">Actualiza una sucursal para traer los departamentos.</span>'}</fieldset>
      <fieldset style="${caja}"><legend style="font-size:13px;color:var(--tinta-2);font-weight:500">Días (ninguno marcado = diario)</legend>
        <div style="display:flex;gap:12px;flex-wrap:wrap">${DIAS.map((d, i) => `<label style="display:flex;gap:6px"><input type="checkbox" data-pdia value="${i}" ${p.dias.includes(i) ? 'checked' : ''}>${d}</label>`).join('')}</div></fieldset>
      <fieldset style="${caja}"><legend style="font-size:13px;color:var(--tinta-2);font-weight:500">Sucursales (ninguna marcada = todas)</legend>
        ${S.sucursales.filter(s => s.activa).map(s => `<label style="display:flex;gap:8px;padding:2px 0"><input type="checkbox" data-ps value="${s.id}" ${p.sucursales.includes(s.id) ? 'checked' : ''}>${esc(s.nombre)}</label>`).join('')}</fieldset>
      ${p.id ? `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pg-a" ${p.activo ? 'checked' : ''}> Activo</label>` : ''}
    </div>
    <div class="panel-pie"><button class="btn primario" id="pg-g">Guardar</button><button class="btn" id="pg-volver">Volver</button></div>`, { angosto: true });
  $('#pg-volver', panel).onclick = vProgramas;
  $('#pg-g', panel).onclick = e => accion(e.currentTarget, async () => {
    const body = {
      nombre: $('#pg-n', panel).value,
      departamentos: $$('[data-pd]:checked', panel).map(i => i.value),
      dias: $$('[data-pdia]:checked', panel).map(i => +i.value),
      sucursales: $$('[data-ps]:checked', panel).map(i => +i.value),
    };
    if (p.id) await api(`/conteos/programas/${p.id}`, { method: 'PUT', body: { ...body, activo: $('#pg-a', panel).checked } });
    else await api('/conteos/programas', { method: 'POST', body });
    toast('Conteo programado guardado'); vProgramas();
  });
}
